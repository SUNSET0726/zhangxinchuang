name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        working-directory: apk-shell

      - name: Rename APK
        run: |
          mkdir -p out
          cp apk-shell/app/build/outputs/apk/release/*.apk out/测试.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-ceshi
          path: out/测试.apk
