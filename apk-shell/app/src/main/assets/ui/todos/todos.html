<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDF5FC">
<title>朝歌 · 共同待办</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EDF5FC; --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --hairline:rgba(44,86,140,.16); --accent:#1f4a8f;
  --card-bg:rgba(255,255,255,.58); --card-line:rgba(255,255,255,.9);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --pad:clamp(14px,4vw,24px);
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-cn);
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(237,245,252,.62) 0%,rgba(237,245,252,.24) 30%,rgba(237,245,252,.10) 66%,rgba(237,245,252,.52) 100%),
    url('../../resources/img/tidal/chat-light.webp');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 6px}
.back{width:34px;height:34px;flex:none;border:1px solid var(--card-line);border-radius:50%;
  background:rgba(255,255,255,.7);color:var(--text);display:grid;place-items:center;cursor:pointer}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font:600 clamp(15px,4vw,17px)/1.3 var(--font-cn);letter-spacing:.06em}
.ttl em{display:block;margin-top:3px;font:400 clamp(8.5px,2.2vw,10px)/1.3 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.08em;color:var(--text-faint);font-style:normal}
.list{flex:1;overflow-y:auto;padding:6px var(--pad) calc(env(safe-area-inset-bottom) + 20px)}
.list::-webkit-scrollbar{display:none}
.bar{margin:2px 0 12px}
.bar .n{font:400 9.5px/1 var(--font-cn);letter-spacing:.2em;color:var(--text-faint)}
.bar .rail{margin-top:7px;height:3px;border-radius:2px;background:rgba(44,86,140,.14);overflow:hidden}
.bar .fill{height:100%;border-radius:2px;background:var(--accent);width:0;transition:width .5s var(--ease)}
.sec{margin:14px 0 7px;font:500 9px/1 var(--font-cn);letter-spacing:.26em;color:var(--text-faint)}
.t{display:flex;gap:11px;align-items:flex-start;background:var(--card-bg);
  border:1px solid var(--card-line);border-radius:15px;box-shadow:var(--card-shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 13px;margin-bottom:8px}
.t .bx{width:16px;height:16px;flex:none;margin-top:2px;border-radius:5px;
  border:1.4px solid rgba(44,86,140,.42);display:grid;place-items:center;color:#fff}
.t .bx svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.t.done .bx{background:var(--accent);border-color:var(--accent)}
.t.done .bx svg{opacity:1}
.t .body{min-width:0;flex:1}
.t h2{font:600 clamp(12px,3.1vw,13.5px)/1.45 var(--font-cn)}
.t p{margin-top:3px;font:400 clamp(9.5px,2.4vw,10.5px)/1.6 var(--font-cn);color:var(--text-soft);
  white-space:pre-wrap}
.t .due{margin-top:6px;font:400 9px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;
  color:var(--text-faint)}
.t.done h2{color:var(--text-faint);text-decoration:line-through;text-decoration-thickness:1px}
.t.done{opacity:.62}
.empty{padding:30px 0;text-align:center;font:400 11px/1.8 var(--font-cn);color:var(--text-faint)}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="back" id="back" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl">
      <h1>共同待办</h1>
      <em>left to do.</em>
    </div>
  </header>
  <main class="list" id="list">
    <div class="bar"><div class="n" id="n">…</div><div class="rail"><div class="fill" id="fill"></div></div></div>
  </main>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var list = $('#list');
  $('#back').addEventListener('click', function () { ZGBack(); });

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  var TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) {
      var all = d.todos || [];
      var todo = all.filter(function (x) { return !x.done; });
      var done = all.filter(function (x) { return x.done; })
        .sort(function (a, b) { return (b.doneAt || '').localeCompare(a.doneAt || ''); });
      var pct = all.length ? Math.round(done.length / all.length * 100) : 0;
      $('#n').textContent = '还没做 ' + todo.length + ' 件 · 已经做了 ' + done.length + ' 件';
      $('#fill').style.width = pct + '%';

      function card(x) {
        return '<article class="t' + (x.done ? ' done' : '') + '">'
          + '<span class="bx">' + TICK + '</span>'
          + '<div class="body"><h2>' + esc(x.title || '') + '</h2>'
          + (x.note ? '<p>' + esc(x.note) + '</p>' : '')
          + (x.dueDay ? '<div class="due">' + (x.done ? 'done · ' : 'due · ') + esc(x.done ? (x.doneAt || x.dueDay) : x.dueDay) + '</div>' : '')
          + '</div></article>';
      }
      var html = '';
      html += '<div class="sec">还没做</div>';
      html += todo.length ? todo.map(card).join('') : '<div class="empty">一件都没剩，真好。</div>';
      if (done.length) {
        html += '<div class="sec">已经做了</div>' + done.map(card).join('');
      }
      list.insertAdjacentHTML('beforeend', html);
    })
    .catch(function () { $('#n').textContent = 'data.json 读不到了'; });
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
