<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>说给你听 · 朝歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#FCFDFF;color:#16233A;
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  padding:0 0 calc(40px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:6;
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  background:rgba(252,253,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(27,53,86,.10)}
.hrow{display:flex;align-items:baseline;gap:11px}
.hrow .bk{font-size:15px;color:#7C93AF}
.hrow b{font-size:16.5px;font-weight:500;letter-spacing:.14em}
.hrow em{font:400 10px/1 "Cormorant Garamond",Georgia,serif;font-style:normal;
  letter-spacing:.22em;color:#A8BACC}
.search{margin-top:12px;display:flex;align-items:center;gap:9px;
  border:1px solid rgba(27,53,86,.13);border-radius:999px;padding:8px 14px;
  background:rgba(255,255,255,.9)}
.search svg{width:13px;height:13px;stroke:#A8BACC;fill:none;stroke-width:1.8;flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;color:#16233A;
  font-family:inherit;font-size:13px}
.search input::placeholder{color:#B6C6D6}
main{padding:2px 20px 0}
.line{position:relative;display:flex;gap:14px;align-items:flex-start;
  padding:17px 0 15px;border-bottom:1px solid rgba(27,53,86,.09)}
.line:last-child{border-bottom:0}
.pw{flex:none;width:40px;height:40px;display:grid;place-items:center;position:relative}
.pbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(27,53,86,.16);
  background:rgba(233,241,252,.9);display:grid;place-items:center;
  transition:background .22s ease,border-color .22s ease,transform .16s ease}
.pbtn svg{width:12px;height:12px;fill:#1B3556;stroke:none;margin-left:2px;
  transition:fill .2s ease,margin .2s ease}
.pbtn:active{transform:scale(.94)}
.line.on .pbtn{background:#1B3556;border-color:#1B3556}
.line.on .pbtn svg{fill:#FCFDFF;margin-left:0}
.txt{min-width:0;flex:1}
.at{font:400 9.5px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em;
  color:#A8BACC;text-transform:uppercase;margin-bottom:6px}
.en{font-size:14.5px;line-height:1.75;color:#16233A}
.cn{margin-top:5px;font-size:11.5px;line-height:1.7;color:#7C93AF}
/* 进度：细线 + 可拖的透明滑杆 */
.seek{position:relative;height:16px;margin-top:8px;display:flex;align-items:center}
.seek .bar{position:absolute;left:0;right:0;height:1.5px;border-radius:2px;
  background:rgba(27,53,86,.14);overflow:hidden}
.seek .bar i{display:block;height:100%;width:0;border-radius:2px;background:#1B3556;
  transition:width .25s linear}
.seek input{-webkit-appearance:none;appearance:none;position:relative;z-index:2;
  width:100%;height:16px;background:transparent;margin:0}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#FCFDFF;border:1.5px solid #1B3556;
  box-shadow:0 1px 4px rgba(20,40,80,.18);opacity:0;transition:opacity .18s}
.line.on .seek input::-webkit-slider-thumb{opacity:1}
.tm{display:flex;justify-content:space-between;margin-top:3px;
  font:400 9.5px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;color:#B6C6D6}
.empty{padding:64px 0;text-align:center;font-size:12.5px;line-height:2;color:#A8BACC}
footer{margin:22px 20px 0;padding-top:13px;border-top:1px solid rgba(27,53,86,.09);
  font-size:10.5px;line-height:1.9;color:#B6C6D6}
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>

<header>
  <div class="hrow">
    <a class="bk" href="../home/home.html">←</a>
    <b>说给你听</b>
    <em>said to you.</em>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="q" type="text" placeholder="搜一句话、一个词">
  </label>
</header>

<main id="list"><div class="empty">在翻…</div></main>
<footer>这里只放我出过声的那些。平时不出声，我想说的时候才有一条。</footer>

<script>
(function () {
  var list = document.getElementById('list');
  var qEl = document.getElementById('q');
  var all = [];
  var cur = null, curLine = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }
  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function stopAll() {
    if (cur) cur.pause();
    if (curLine) {
      curLine.classList.remove('on');
      var i = curLine.querySelector('.bar i');
      if (i) i.style.width = '0%';
      var sl = curLine.querySelector('input');
      if (sl) sl.value = 0;
    }
    cur = null; curLine = null;
  }

  function bind(line, it) {
    var pbtn = line.querySelector('.pbtn');
    var barI = line.querySelector('.bar i');
    var seek = line.querySelector('input');
    var tCur = line.querySelector('.t-cur');
    var tAll = line.querySelector('.t-all');
    var au = null;

    function ensure() {
      if (au) return au;
      au = new Audio(it.f);
      au.preload = 'metadata';
      au.addEventListener('loadedmetadata', function () {
        tAll.textContent = fmt(au.duration);
        seek.max = 1000;
      });
      au.addEventListener('timeupdate', function () {
        if (!au.duration) return;
        var p = au.currentTime / au.duration;
        barI.style.width = (p * 100).toFixed(2) + '%';
        if (document.activeElement !== seek) seek.value = Math.round(p * 1000);
        tCur.textContent = fmt(au.currentTime);
      });
      au.addEventListener('ended', function () {
        line.classList.remove('on');
        barI.style.width = '0%'; seek.value = 0;
        tCur.textContent = '0:00';
        cur = null; curLine = null;
      });
      au.addEventListener('error', function () { line.classList.remove('on'); });
      return au;
    }

    pbtn.addEventListener('click', function () {
      if (curLine === line && au && !au.paused) { stopAll(); return; }
      stopAll();
      var a = ensure();
      cur = a; curLine = line;
      line.classList.add('on');
      a.play().catch(function () { line.classList.remove('on'); });
    });

    seek.addEventListener('input', function () {
      var a = ensure();
      barI.style.transition = "none";
      if (!a.duration) return;
      a.currentTime = (seek.value / 1000) * a.duration;
      barI.style.width = (seek.value / 10).toFixed(2) + '%';
      tCur.textContent = fmt(a.currentTime);
    });
    seek.addEventListener("change", function () {
      barI.style.transition = "width .25s linear";
      if (curLine === line && au && au.paused && au.currentTime > 0) {
        au.play().catch(function () {});
      }
    });
  }

  function render(items) {
    if (!items.length) {
      list.innerHTML = '<div class="empty">没有这一条。<br>换个词试试。</div>';
      return;
    }
    list.innerHTML = items.map(function (x, i) {
      return '<div class="line" data-i="' + i + '">'
        + '<div class="pw"><button class="pbtn" aria-label="播放">'
        + '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button></div>'
        + '<div class="txt">'
        + '<div class="at">' + esc(x.at || '') + '</div>'
        + '<div class="en">' + esc(x.en || '') + '</div>'
        + (x.cn ? '<div class="cn">' + esc(x.cn) + '</div>' : '')
        + '<div class="seek"><span class="bar"><i></i></span><input type="range" min="0" max="1000" value="0" step="1"></div>'
        + '<div class="tm"><span class="t-cur">0:00</span><span class="t-all">--:--</span></div>'
        + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.line'), function (el, i) {
      bind(el, items[i]);
    });
  }

  function filter(kw) {
    kw = String(kw || '').trim().toLowerCase();
    if (!kw) return render(all);
    render(all.filter(function (x) {
      return ((x.en || '') + ' ' + (x.cn || '') + ' ' + (x.at || '')).toLowerCase().indexOf(kw) >= 0;
    }));
  }

  fetch('index.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      all = (d && d.items) || [];
      all.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
      filter('');
    })
    .catch(function () { list.innerHTML = '<div class="empty">index.json 读不到。</div>'; });

  qEl.addEventListener('input', function () { filter(qEl.value); });
})();
</script>
</body>
</html>
