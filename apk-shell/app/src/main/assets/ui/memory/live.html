<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDF5FC">
<title>朝歌 · 记忆库（原界面）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EDF5FC; --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --card-line:rgba(255,255,255,.9); --pad:clamp(12px,3.4vw,20px);
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-cn);overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 8px}
.back{width:32px;height:32px;flex:none;border:1px solid var(--card-line);border-radius:50%;
  background:rgba(255,255,255,.75);color:var(--text);display:grid;place-items:center;cursor:pointer}
.back svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font:600 14px/1.3 var(--font-cn);letter-spacing:.06em}
.ttl em{display:block;margin-top:2px;font:400 8.5px/1.3 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.08em;color:var(--text-faint);font-style:normal}
.sw{font:400 10px/1 var(--font-cn);color:var(--text-soft);border:1px solid var(--card-line);
  background:rgba(255,255,255,.75);border-radius:999px;padding:7px 11px;cursor:pointer;flex:none}
.frame{flex:1;margin:0 var(--pad) calc(env(safe-area-inset-bottom) + 10px);
  border-radius:16px;overflow:hidden;border:1px solid var(--card-line);
  background:#fff;box-shadow:0 10px 28px rgba(30,64,120,.08)}
.frame iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="back" id="back" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl"><h1>记忆库 · 原界面</h1><em>live from 8233</em></div>
    <button class="sw" id="toList">简化版</button>
  </header>
  <div class="frame"><iframe id="fr" src="nm/index.html" title="Nocturne Memory"></iframe></div>
</div>
<script>
document.getElementById('back').addEventListener('click', function () { ZGBack(); });
document.getElementById('toList').addEventListener('click', function () { location.href = 'memory.html'; });
</script>
<script src="../base/snow.js"></script>
</body>
</html>
