<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7FAFF">
<title>设定 · 朝歌</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #F8FBFF 0%, #EFF6FF 100%);
    color: #22405F;
    font: 400 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  .top {
    position: sticky; top: 0; z-index: 9;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: rgba(248,251,255,.82);
    backdrop-filter: blur(16px) saturate(1.5);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    border-bottom: 1px solid rgba(214,226,240,.7);
  }
  .top b { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  .top .en {
    margin-left: auto; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #8AA6C4;
  }
  .iconbtn {
    width: 34px; height: 34px; border: 0; border-radius: 12px;
    background: #fff; color: #5C7799; font-size: 17px; line-height: 1;
    box-shadow: 0 2px 8px rgba(28,58,96,.07);
    transition: transform .16s ease;
  }
  .iconbtn:active { transform: scale(.9); }
  .wrap { flex: 1; overflow-y: auto; padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); }
  .eyebrow {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: #8AA6C4; margin: 4px 2px 10px;
  }
  .sec { margin-bottom: 26px; }
  .card {
    background: #fff; border-radius: 20px; padding: 18px 16px;
    box-shadow: 0 6px 22px rgba(28,58,96,.07);
    font-size: 14.5px; line-height: 1.85;
  }
  .card .h {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: #2F6FD0; margin: 18px 0 6px;
  }
  .card .h:first-child { margin-top: 0; }
  .card .p { white-space: pre-wrap; color: #33507A; }
  .card .nm { font-size: 21px; font-weight: 600; letter-spacing: .04em; color: #1D3A5C; margin-bottom: 2px; }
  .ro {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: 8px; padding: 2px 9px; border-radius: 999px;
    background: #EAF2FE; color: #2F6FD0; font-size: 11px; vertical-align: 3px;
  }
  .item {
    background: #fff; border-radius: 16px; padding: 13px 14px;
    box-shadow: 0 4px 16px rgba(28,58,96,.055);
    margin-bottom: 10px;
  }
  .ih { display: flex; align-items: flex-start; gap: 8px; }
  .ih b { flex: 1; font-size: 14.5px; font-weight: 500; line-height: 1.45; color: #22405F; }
  .tag {
    flex: none; padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
    letter-spacing: .02em;
  }
  .tag.a { background: #E7F0FF; color: #2F6FD0; }
  .tag.t { background: #F1F4F9; color: #7F93AC; }
  .tag.off { background: #FDECEC; color: #D06A6A; }
  .pri { flex: none; font-size: 11px; color: #A8BBD0; font-variant-numeric: tabular-nums; }
  .ik { margin-top: 7px; color: #8AA6C4; font-size: 11.5px; line-height: 1.7; word-break: break-all; }
  .ib {
    display: none; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed #E4EDF8;
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.85; color: #3A5677;
  }
  .item.on .ib { display: block; }
  .item.on { box-shadow: 0 10px 28px rgba(28,58,96,.1); }
  .foot {
    margin: 8px 4px 0; color: #9DB2C8; font-size: 12px; line-height: 1.8; text-align: center;
  }
  .empty { color: #A8BBD0; font-size: 13px; padding: 8px 4px; }
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="iconbtn" id="back" aria-label="返回">←</button>
    <b>设定</b>
    <span class="en">setting · read only</span>
  </div>
  <div class="wrap">
    <div class="sec">
      <div class="eyebrow">他是谁 · who he is</div>
      <div class="card" id="card"><div class="empty">读着…</div></div>
    </div>
    <div class="sec">
      <div class="eyebrow">世界书 · world book <span id="cnt"></span></div>
      <div id="wb"><div class="empty">读着…</div></div>
    </div>
    <div class="foot">这两样都只读。要改，跟烬先生说一句，他落笔。</div>
  </div>
</div>
<script src="../base/theme.js?v=1021a"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&#34;' })[c];
    });
  }
  document.getElementById('back').addEventListener('click', function () {
    var pc = (window.self !== window.top && window.parent) ? window.parent.ZGCover : window.ZGCover;
    if (pc && pc.back) { pc.back(); return; }
    if (typeof ZGBack === 'function') { ZGBack(); return; }
    if (history.length > 1) { history.back(); }
  });

  fetch('card.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var parts = String(t).split(/^### /m).filter(function (x) { return x.trim(); });
      var h = '';
      parts.forEach(function (p, i) {
        var k = p.indexOf('\n');
        var title = (k < 0 ? p : p.slice(0, k)).trim();
        var body = (k < 0 ? '' : p.slice(k + 1)).trim();
        if (i === 0) {
          h += '<div class="nm">' + esc(body || title) + '</div><div style="margin-bottom:6px"><span class="ro">只读</span></div>';
          return;
        }
        if (title === '简介') { h += '<div style="color:#5C7799;font-size:13px;margin-bottom:4px">' + esc(body) + '</div>'; return; }
        h += '<div class="h">' + esc(title) + '</div><div class="p">' + esc(body) + '</div>';
      });
      document.getElementById('card').innerHTML = h || '<div class="empty">读不到角色卡</div>';
    })
    .catch(function () {
      document.getElementById('card').innerHTML = '<div class="empty">读不到角色卡</div>';
    });

  fetch('wb.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = (d && d.wb) || [];
      document.getElementById('cnt').textContent = '· ' + list.length + ' 条';
      if (!list.length) { document.getElementById('wb').innerHTML = '<div class="empty">还没有条目</div>'; return; }
      var h = list.map(function (x, i) {
        var tag = x.always ? '<span class="tag a">常驻</span>' : '<span class="tag t">触发</span>';
        if (!x.enabled) { tag = '<span class="tag off">停用</span>'; }
        var kw = (x.keywords || []).slice(0, 8).map(function (k) { return '#' + k; }).join('  ');
        return '<div class="item" data-i="' + i + '">'
          + '<div class="ih"><b>' + esc(x.name) + '</b>' + tag + '<span class="pri">' + (x.priority || 0) + '</span></div>'
          + (kw ? '<div class="ik">' + esc(kw) + '</div>' : '')
          + '<div class="ib">' + esc(x.content) + '</div></div>';
      }).join('');
      var box = document.getElementById('wb');
      box.innerHTML = h;
      box.addEventListener('click', function (e) {
        var it = e.target;
        while (it && it !== box && !it.getAttribute('data-i')) { it = it.parentNode; }
        if (!it || it === box) { return; }
        it.classList.toggle('on');
      });
    })
    .catch(function () {
      document.getElementById('wb').innerHTML = '<div class="empty">读不到世界书</div>';
    });
})();
</script>
</body>
</html>
