<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDF5FC">
<title>朝歌 · 记忆库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EDF5FC; --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --hairline:rgba(44,86,140,.16); --accent:#1f4a8f;
  --card-bg:rgba(255,255,255,.58); --card-line:rgba(255,255,255,.9);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --pad:clamp(14px,4vw,24px);
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-cn);
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(237,245,252,.62) 0%,rgba(237,245,252,.24) 30%,rgba(237,245,252,.10) 66%,rgba(237,245,252,.52) 100%),
    url('../../resources/img/tidal/chat-light.webp');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 6px}
.back{width:34px;height:34px;flex:none;border:1px solid var(--card-line);border-radius:50%;
  background:rgba(255,255,255,.7);color:var(--text);display:grid;place-items:center;cursor:pointer}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font:600 clamp(15px,4vw,17px)/1.3 var(--font-cn);letter-spacing:.06em}
.ttl em{display:block;margin-top:3px;font:400 clamp(8.5px,2.2vw,10px)/1.3 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.08em;color:var(--text-faint);font-style:normal}
.qwrap{padding:2px var(--pad) 10px;flex:0 0 auto}
.q{width:100%;border:1px solid var(--card-line);background:rgba(255,255,255,.72);
  border-radius:999px;padding:9px 14px;font:400 11.5px/1 var(--font-cn);color:var(--text);outline:none}
.q::placeholder{color:var(--text-faint)}
.sw{font:400 10px/1 var(--font-cn);color:var(--text-soft);border:1px solid var(--card-line);
  background:rgba(255,255,255,.75);border-radius:999px;padding:7px 11px;cursor:pointer;flex:none}
.list{flex:1;overflow-y:auto;padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 20px)}
.list::-webkit-scrollbar{display:none}
.frame{flex:1;display:none;margin:0 var(--pad) calc(env(safe-area-inset-bottom) + 10px);
  border-radius:16px;overflow:hidden;border:1px solid var(--card-line);background:rgba(255,255,255,.6);
  box-shadow:0 10px 28px rgba(30,64,120,.07)}
.frame.on{display:block}
.frame iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.stat{margin:2px 0 10px;font:400 9.5px/1 var(--font-cn);letter-spacing:.2em;color:var(--text-faint)}
.m{background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px;
  box-shadow:var(--card-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:transform 150ms var(--ease)}
.m:active{transform:scale(.985)}
.m .u{font:400 9px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;color:var(--text-faint);
  word-break:break-all}
.m h2{margin-top:5px;font:600 clamp(11.5px,3vw,13px)/1.45 var(--font-cn)}
.m p{margin-top:5px;font:400 clamp(10px,2.6vw,11px)/1.75 var(--font-cn);color:var(--text-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.m.open p{-webkit-line-clamp:unset;display:block}
.m .tag{margin-top:6px;font:400 8.5px/1 var(--font-cn);letter-spacing:.12em;color:var(--accent);opacity:.72}
.empty{padding:26px 0;text-align:center;font:400 11px/1.8 var(--font-cn);color:var(--text-faint)}
.more{padding:10px;text-align:center}
.more button{border:1px solid var(--card-line);background:rgba(255,255,255,.8);border-radius:999px;
  padding:8px 16px;font:400 11px/1 var(--font-cn);color:var(--text);cursor:pointer}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="back" id="back" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl"><h1>记忆库</h1><em>what we remember.</em></div>
    <button class="sw" id="tog">快照</button>
  </header>
  <div class="qwrap"><input class="q" id="q" placeholder="搜一条：名字、事、话都行"></div>
  <main class="list" id="list" style="display:none">
    <div class="stat" id="stat">…</div>
  </main>
  <div class="frame on" id="frame"><iframe src="nm/index.html" title="实时记忆库"></iframe></div>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var list = $('#list'), stat = $('#stat'), q = $('#q');
  $('#back').addEventListener('click', function () { ZGBack(); });
  var frame = document.getElementById('frame'), tog = document.getElementById('tog'),
      qwrap = document.querySelector('.qwrap');
  qwrap.style.display = 'none';
  tog.addEventListener('click', function () {
    var live = frame.classList.toggle('on');
    list.style.display = live ? 'none' : 'block';
    qwrap.style.display = live ? 'none' : 'block';
    tog.textContent = live ? '快照' : '实时';
    if (!live) paint();
  });

  var ALL = [], shown = 40, EXP = '', LIVE = false;
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function row(x) {
    var head = x.disc || (x.text || '').slice(0, 40);
    return '<article class="m">'
      + '<div class="u">' + esc(x.uri || '') + (x.pri ? '  · p' + x.pri : '') + (x.at ? '  · ' + esc(x.at) : '') + '</div>'
      + '<h2>' + esc(head) + '</h2>'
      + '<p>' + esc(x.text || '') + '</p>'
      + (x.domain ? '<div class="tag">' + esc(x.domain) + '</div>' : '')
      + '</article>';
  }
  function bind() {
    list.querySelectorAll('.m').forEach(function (el) {
      el.addEventListener('click', function () { el.classList.toggle('open'); });
    });
  }
  function paint() {
    var kw = q.value.trim(), arr = ALL;
    if (kw) {
      var low = kw.toLowerCase();
      arr = ALL.filter(function (x) {
        return (x.text || '').toLowerCase().indexOf(low) >= 0
          || (x.disc || '').toLowerCase().indexOf(low) >= 0
          || (x.uri || '').toLowerCase().indexOf(low) >= 0
          || (x.domain || '').toLowerCase().indexOf(low) >= 0;
      });
    }
    var part = arr.slice(0, kw ? 120 : shown);
    list.querySelectorAll('.m, .empty, .more').forEach(function (n) { n.remove(); });
    stat.textContent = (kw ? ('搜到 ' + arr.length + ' 条') : (arr.length + ' 条 · 先摆前面 ' + part.length))
      + (EXP ? (LIVE ? ' · 库里刚同步 ' + EXP.slice(11) : ' · 导出于 ' + EXP.slice(11)) : '');
    if (!part.length) { list.insertAdjacentHTML('beforeend', '<div class="empty">没搜到。</div>'); return; }
    list.insertAdjacentHTML('beforeend', part.map(row).join(''));
    if (!kw && arr.length > shown) {
      list.insertAdjacentHTML('beforeend', '<div class="more"><button id="more">再摆一些</button></div>');
      document.getElementById('more').addEventListener('click', function () { shown += 40; paint(); });
    }
    bind();
  }

  function loadMem() {
    return fetch('live.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .catch(function () {
        return fetch('memory.json', { cache: 'no-store' }).then(function (r) { return r.json(); });
      });
  }
  loadMem()
    .then(function (d) {
      ALL = (d.items || []).slice();
      if (!ALL.length) { throw new Error('empty'); }
      if (!ALL[0].at) {
        ALL.sort(function (a, b) { return (b.pri || 0) - (a.pri || 0); });
      }
      EXP = d.at || d.exported_at || '';
      LIVE = !!d.at;
      paint();
    })
    .catch(function () { stat.textContent = '记忆库读不到了'; });

  var t = null;
  q.addEventListener('input', function () { clearTimeout(t); t = setTimeout(paint, 180); });
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
