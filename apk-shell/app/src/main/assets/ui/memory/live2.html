<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDF5FC">
<title>朝歌 · 记忆库（实时）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EDF5FC; --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --card-bg:rgba(255,255,255,.58); --card-line:rgba(255,255,255,.9);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --pad:clamp(14px,4vw,24px); --accent:#1f4a8f;
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-cn);overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(237,245,252,.62) 0%,rgba(237,245,252,.24) 30%,rgba(237,245,252,.10) 66%,rgba(237,245,252,.52) 100%),
    url('../../resources/img/tidal/chat-light.webp');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 4px}
.back{width:32px;height:32px;flex:none;border:1px solid var(--card-line);border-radius:50%;
  background:rgba(255,255,255,.75);color:var(--text);display:grid;place-items:center;cursor:pointer}
.back svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font:600 clamp(14px,3.8vw,16px)/1.3 var(--font-cn);letter-spacing:.05em}
.ttl em{display:block;margin-top:2px;font:400 clamp(8px,2vw,9.5px)/1.3 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.08em;color:var(--text-faint);font-style:normal}
.up{border:1px solid var(--card-line);background:rgba(255,255,255,.75);border-radius:999px;
  padding:7px 11px;font:400 10px/1 var(--font-cn);color:var(--text-soft);cursor:pointer;flex:none}
.qwrap{padding:4px var(--pad) 8px;flex:0 0 auto}
.q{width:100%;border:1px solid var(--card-line);background:rgba(255,255,255,.75);
  border-radius:999px;padding:9px 13px;font:400 11.5px/1 var(--font-cn);color:var(--text);outline:none}
.q::placeholder{color:var(--text-faint)}
.crumb{padding:0 var(--pad) 6px;font:400 9px/1.5 var(--font-cn);letter-spacing:.1em;color:var(--text-faint)}
.list{flex:1;overflow-y:auto;padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 18px)}
.list::-webkit-scrollbar{display:none}
.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dom{background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;
  box-shadow:var(--card-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:14px 13px;cursor:pointer}
.dom b{font:600 14px/1.3 var(--font-cn);letter-spacing:.06em}
.dom span{display:block;margin-top:6px;font:400 10px/1.4 var(--font-cn);color:var(--text-soft)}
.dom em{display:block;margin-top:8px;font:400 9px/1 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.1em;color:var(--text-faint);font-style:normal}
.it{display:flex;gap:9px;align-items:center;padding:11px 12px;margin-bottom:7px;
  background:rgba(255,255,255,.62);border:1px solid var(--card-line);border-radius:13px;
  box-shadow:0 6px 18px rgba(30,64,120,.05);cursor:pointer}
.it .txt{flex:1;min-width:0}
.it .t1{font:400 12px/1.45 var(--font-cn)}
.it .t2{margin-top:3px;font:400 9px/1.4 var(--font-cn);color:var(--text-faint);word-break:break-all}
.it .go{flex:none;color:var(--text-faint);font-size:12px}
.node{background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;
  box-shadow:var(--card-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:13px 14px;margin-bottom:9px}
.node h2{font:600 clamp(12px,3.1vw,13.5px)/1.5 var(--font-cn)}
.node .u{margin-top:5px;font:400 8.5px/1.4 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.04em;color:var(--text-faint);word-break:break-all}
.node .body{margin-top:8px;font:400 clamp(10.5px,2.7vw,11.5px)/1.9 var(--font-cn);
  color:var(--text-soft);white-space:pre-wrap;word-break:break-word;max-height:62vh;overflow:auto}
.shead{margin:12px 0 7px;font:500 9px/1 var(--font-cn);letter-spacing:.26em;color:var(--text-faint)}
.empty{padding:26px 0;text-align:center;font:400 11px/1.9 var(--font-cn);color:var(--text-faint)}
.err{padding:18px 11px;text-align:center;font:400 11px/1.9 var(--font-cn);color:#b46a6a}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="back" id="back" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl"><h1>记忆库 · 实时</h1><em>live from the bank</em></div>
    <button class="up" id="up">上一级</button>
  </header>
  <div class="qwrap"><input class="q" id="q" placeholder="搜一条：朝朝、快递、纹身…"></div>
  <div class="crumb" id="crumb">五个抽屉</div>
  <main class="list" id="list"><div class="empty">正在连…</div></main>
</div>
<script>
(function () {
  var API = 'http://127.0.0.1:8233/api/browse';
  var $ = function (s) { return document.querySelector(s); };
  var list = $('#list'), crumb = $('#crumb'), q = $('#q');
  var cur = '';
  var NAME = { core: '核心', writer: '写作', game: '游戏', notes: '笔记', narrative: '叙事' };
  var LABEL = {
    'core://agent': '我是谁', 'core://my_user': '她是谁',
    'core://agent/my_user': '我和她', 'core://operating_principles': '做事的原则',
    'core://philosophy': '想法与立场'
  };
  var EN = { core: 'core', writer: 'writer', game: 'game', notes: 'notes', narrative: 'narrative' };
  $('#back').addEventListener('click', function () { location.href = 'memory.html'; });
  if (window.top !== window.self) { document.getElementById('back').style.display = 'none'; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fail(m) {
    list.innerHTML = '<div class="err">' + esc(m) + '<br>等它醒一下再点一次。</div>';
  }
  function beep(t) { crumb.textContent = t; }

  function loadDomains() {
    cur = ''; q.value = ''; beep('五个抽屉');
    list.innerHTML = '<div class="empty">翻着…</div>';
    fetch(API + '/domains', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (arr) {
        list.innerHTML = '<div class="g">' + arr.map(function (d) {
          return '<div class="dom" data-d="' + esc(d.domain) + '">'
            + '<b>' + esc(NAME[d.domain] || d.domain) + '</b>'
            + '<span>' + (d.root_count ? d.root_count + ' 条起头' : '空着') + '</span>'
            + '<em>' + esc(d.domain) + '</em></div>';
        }).join('') + '</div>';
        list.querySelectorAll('.dom').forEach(function (el) {
          el.addEventListener('click', function () { loadNode(el.getAttribute('data-d') + '://'); });
        });
      })
      .catch(function () { fail('连不上记忆库。'); });
  }

  function loadNode(uri) {
    cur = uri; q.value = ''; beep(uri);
    list.innerHTML = '<div class="empty">翻着…</div>';
    fetch(API + '/node?uri=' + encodeURIComponent(uri), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var n = d.node || {}, kids = d.children || [], html = '';
        cur = n.uri || uri; beep(cur);
        if (n.content && n.path) {
          html += '<section class="node"><h2>' + esc(LABEL[n.uri] || n.disclosure || n.name || '') + '</h2>'
            + '<div class="u">' + esc(n.uri) + '</div>'
            + '<div class="body">' + esc(n.content) + '</div></section>';
        }
        if (kids.length) {
          html += '<div class="shead">' + kids.length + ' 条</div>' + kids.map(function (k) {
            return '<div class="it" data-u="' + esc(k.uri) + '">'
              + '<div class="txt"><div class="t1">' + esc(LABEL[k.uri] || k.disclosure || k.name || k.path || '') + '</div>'
              + '<div class="t2">' + esc(k.uri) + '</div></div>'
              + '<span class="go">›</span></div>';
          }).join('');
        }
        if (!html) html = '<div class="empty">这条是空的。</div>';
        list.innerHTML = html;
        list.querySelectorAll('.it').forEach(function (el) {
          el.addEventListener('click', function () { loadNode(el.getAttribute('data-u')); });
        });
        list.scrollTop = 0;
      })
      .catch(function () { fail('这条没取到。'); });
  }

  function search(kw) {
    beep('搜「' + kw + '」');
    list.innerHTML = '<div class="empty">搜着…</div>';
    fetch(API + '/search?q=' + encodeURIComponent(kw), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var rs = d.results || [];
        beep('搜「' + kw + '」· ' + rs.length + ' 条');
        if (!rs.length) { list.innerHTML = '<div class="empty">库里没有这条。</div>'; return; }
        list.innerHTML = rs.map(function (x, i) {
          return '<div class="it" data-i="' + i + '">'
            + '<div class="txt"><div class="t1">' + esc(x.disclosure || x.name || '') + '</div>'
            + '<div class="t2">' + esc(x.uri) + '</div></div><span class="go">›</span></div>';
        }).join('');
        list.querySelectorAll('.it').forEach(function (el) {
          el.addEventListener('click', function () { loadNode(rs[+el.getAttribute('data-i')].uri); });
        });
      })
      .catch(function () { fail('搜索没连上。'); });
  }

  $('#up').addEventListener('click', function () {
    if (!cur) return;
    var t = cur.replace(/\/+$/, ''), i = t.lastIndexOf('/');
    var p = i > 6 ? t.slice(0, i) : '';
    if (!p || p === 'core:' || p.length <= 7) { loadDomains(); return; }
    loadNode(p);
  });

  var tm = null;
  q.addEventListener('input', function () {
    clearTimeout(tm);
    var kw = q.value.trim();
    tm = setTimeout(function () {
      if (kw) search(kw);
      else if (cur) loadNode(cur); else loadDomains();
    }, 300);
  });

  loadDomains();
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
