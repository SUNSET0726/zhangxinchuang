*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --card:#fdfeff; --card2:#e7f0fb;
  --ink:#1B3556; --sub:#4A6B93; --hint:#8199B6; --line:rgba(44,86,140,.14);
  --accent:#1f4a8f; --accent-soft:#dbe8fa;
  --shadow:0 10px 28px rgba(30,64,120,.07);
  --shadow-lift:0 14px 34px rgba(30,64,120,.08);
  --r:16px; --card-border:none;
  /* —— Tidal Echo · PEARL TIDE 换色版 —— 结构照它，色值换我们的蓝 —— */
  --bg:#EDF5FC; --header-bg:#EDF5FC;
  --hairline:rgba(44,86,140,.16);
  --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --accent-fg:#ffffff;
  --card-bg:rgba(255,255,255,.64);
  --card-line:rgba(255,255,255,.92);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --soft-shadow:0 14px 34px rgba(30,64,120,.08);
  --bubble-radius:clamp(14px,2vw,20px);
  --composer-bg:#E7F0FA;
  --field-bg:rgba(255,255,255,.92);
  --field-line:rgba(120,150,190,.20);
  --motion-fast:150ms; --motion-normal:260ms;
  --ease-soft:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--font-cn);
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg, rgba(237,245,252,.58) 0%, rgba(237,245,252,.20) 28%,
      rgba(237,245,252,.08) 66%, rgba(237,245,252,.48) 100%),
    url('../../resources/img/tidal/chat-light.webp');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat}
body::after{content:'PEARL BLUE';position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 58px);
  z-index:0;font:400 8px/1 var(--font-cn);letter-spacing:.22em;
  color:rgba(44,86,140,.34);pointer-events:none}
svg.i{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* 顶栏 */
.hd{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;flex:0 0 auto}
.clock{display:flex;align-items:baseline;gap:9px}
.clock b{font:300 46px/1 "Times New Roman",Georgia,serif;letter-spacing:.01em;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.clock span{font:400 13px/1 var(--font-cn);
  letter-spacing:.2em;color:#5f7ea7;text-transform:uppercase}
.ava{width:38px;height:38px;border-radius:50%;object-fit:cover;
  border:1px solid rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(20,48,100,.16)}

/* 主区 */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 16px}
.main::-webkit-scrollbar{display:none}

.hero{margin:6px 0 20px}
.days{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.94);
  font:400 10.5px/1 var(--font-cn);letter-spacing:.14em;
  color:#46648f;backdrop-filter:blur(14px);box-shadow:0 5px 16px rgba(20,48,100,.07)}
.days i{width:5px;height:5px;border-radius:50%;background:#54c08a;display:block}
.say{margin:14px 0 0;font:400 17px/1.75 "Songti SC","Noto Serif SC",serif;
  color:#1c3b6b;letter-spacing:.02em}
.say::after{content:'';display:block;width:26px;height:1px;
  background:rgba(22,51,107,.28);margin-top:14px}

/* 卡片格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:104px;padding:14px;border-radius:22px;text-align:left;cursor:pointer;
  border:1px solid rgba(255,255,255,.96);
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.66));
  box-shadow:0 10px 26px rgba(20,48,100,.09),inset 0 1px 0 rgba(255,255,255,.95);
  color:#16336b;transition:transform .16s ease}
.card:active{transform:scale(.975)}
.card .ic{width:30px;height:30px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,#e9f0fc,#d9e4f7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.card .tt{font:500 13.5px/1.2 var(--font-cn);letter-spacing:.06em}
.card .sub{margin-top:5px;font:400 10.5px/1.3 var(--font-cn);
  color:#7590b4;letter-spacing:.02em}
.card.dark{background:linear-gradient(158deg,#27498d,#16336b);color:#f4f8ff;
  border-color:rgba(255,255,255,.2);
  box-shadow:0 14px 30px rgba(20,48,100,.26),inset 0 1px 0 rgba(255,255,255,.22)}
.card.dark .ic{background:rgba(255,255,255,.16);box-shadow:none;color:#eaf1ff}
.card.dark .sub{color:#b9cbe6}

/* 底栏 */
.tabs{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;
  padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.84));
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -8px 26px rgba(20,48,100,.05)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:5px 10px;border-radius:14px;cursor:pointer;color:#7c96b8;
  font:400 10px/1 var(--font-cn);letter-spacing:.04em}
.tab svg{width:19px;height:19px;stroke-width:1.6}
.tab.on{color:#16336b}
.tab.on svg{stroke-width:1.9}
.tab:active{background:rgba(255,255,255,.55)}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:40;
  padding:9px 16px;border-radius:999px;background:rgba(22,51,107,.9);color:#f2f7ff;
  font:400 12px/1 var(--font-cn);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;box-shadow:0 10px 26px rgba(20,48,100,.28)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 侧边栏 */
.snmask{position:fixed;inset:0;z-index:59;background:rgba(18,40,80,.26);opacity:0;
  pointer-events:none;transition:opacity .3s}
.snmask.on{opacity:1;pointer-events:auto}
/* 卡片进场 */
.card{animation:cardin .46s cubic-bezier(.22,.9,.24,1)}
@keyframes cardin{from{transform:translateY(9px)}to{transform:none}}

/* 三条杠按钮 */
.menubtn{position:fixed;right:calc(var(--side-pad) + 2px);z-index:41;
  top:calc(env(safe-area-inset-top) + clamp(10px,2.2vw,20px) + 12px + var(--avatar-size) + 8px);
  width:44px;height:44px;border-radius:14px;box-sizing:border-box;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(27,53,86,.08);box-shadow:0 6px 16px rgba(24,52,102,.06);
  transition:transform .18s cubic-bezier(.22,.9,.24,1),background .18s}
.menubtn i{display:block;width:17px;height:1.5px;border-radius:2px;background:#46628a;opacity:.8}
.menubtn:active{transform:scale(.93);background:rgba(255,255,255,.9)}
/* ── 抽屉（照连环） ── */
.snmask{position:fixed;inset:0;background:rgba(20,17,15,.34);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .24s cubic-bezier(.22,.9,.24,1)}
.snmask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:286px;max-width:86vw;z-index:61;
  background:rgba(248,251,255,.98);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 18px 44px rgba(20,40,80,.18);
  transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,1,1);
  display:flex;flex-direction:column;border-radius:0 16px 16px 0;
}
.drawer.on{transform:none;transition:transform .3s cubic-bezier(.22,.9,.24,1)}
.dhead{flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;
  border-bottom:1px solid rgba(27,53,86,.08)}
.dhead span{font-size:14px;color:var(--text-faint)}
.dbody{flex:1;overflow-y:auto;padding:6px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.dgroup{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);
  padding:16px 8px 5px;cursor:default}
.ditem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;
  background:transparent;color:var(--text);font-family:inherit;font-size:14px;
  padding:9px 10px;border-radius:10px;cursor:pointer;text-decoration:none;
  transition:background .15s,transform .16s cubic-bezier(.22,.9,.24,1)}
.ditem:active{background:rgba(27,53,86,.06);transform:scale(.99)}
.ditem small{color:var(--text-faint);font-size:11.5px;margin-left:2px}
</style>

<style>
/* —— 照 Tidal Echo「PEARL TIDE」的结构量，只换我们的蓝 —— */
:root{
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
  --side-pad:clamp(14px,4vw,24px);
  --pad-x:var(--side-pad);
  --avatar-size:clamp(78px,13.5vw,120px);
  --card-bg:rgba(255,255,255,.46);
  --card-line:rgba(255,255,255,.86);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --soft-shadow:0 14px 34px rgba(30,64,120,.09);
  --seg-track:rgba(255,255,255,.55);
  --row-press:rgba(44,86,140,.07);
  --status-dot:#54c08a;
}
.hd{display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + clamp(10px,2.2vw,20px)) calc(var(--avatar-size) + var(--side-pad) + 14px) 6px var(--side-pad)}
.ava{position:absolute;right:calc(var(--side-pad) + 18px);top:calc(env(safe-area-inset-top) + clamp(10px,2.2vw,20px) + 12px);
  width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;object-fit:cover;
  border:1px solid rgba(255,255,255,.94);box-shadow:0 12px 24px rgba(24,46,67,.14)}
.days{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:5px 12px;border-radius:999px;
  background:var(--seg-track);border:1px solid var(--card-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--soft-shadow);
  font:400 12.5px/1 var(--font-cn);letter-spacing:.14em;color:var(--text-soft)}
.days i{width:5px;height:5px;border-radius:50%;background:var(--status-dot);display:block}
.anchor{margin-top:7px;font:400 clamp(11px,2.9vw,12.5px)/1.7 var(--font-cn);color:var(--text-soft);max-width:82%}
.anchor b{color:var(--text);font-weight:400}
.pages{flex:1;width:100%;position:relative;overflow:hidden;margin-top:8px}
.track{display:flex;height:100%;width:400%;transition:transform .45s cubic-bezier(.22,.9,.24,1)}
.pg{width:25%;height:100%;flex:0 0 auto;overflow-y:auto;padding:2px var(--pad-x) 10px}
.pg::-webkit-scrollbar{display:none}
.ptitle{font:500 9px/1 var(--font-cn);letter-spacing:.26em;color:var(--text-faint);margin:2px 0 10px}
.grid{grid-template-columns:1fr 1fr;gap:clamp(7px,2vw,10px)}
.card{min-height:clamp(66px,17vw,80px);padding:10px 12px;border-radius:15px;
  background:var(--card-bg);border:1px solid var(--card-line);

  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

  transition:transform var(--motion-fast) var(--ease-soft),box-shadow var(--motion-normal) var(--ease-soft)}
.card:active{transform:scale(.973);box-shadow:var(--soft-shadow)}
@keyframes pop{from{transform:translateY(6px) scale(.985)}to{transform:none}}
.card .ic{width:clamp(22px,5.6vw,26px);height:clamp(22px,5.6vw,26px);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72);color:var(--accent);box-shadow:none;opacity:1}

.en{margin-top:6px;font:400 clamp(8px,2.1vw,9.5px)/1.35 "Cormorant Garamond",Georgia,serif;

.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(44,86,140,.18);
  transition:all var(--motion-normal) var(--ease-soft)}
.dots i.on{background:var(--accent);width:15px;border-radius:3px}
.tabs{grid-template-columns:none;display:flex;justify-content:space-around;align-items:flex-end;

</style>

(function () {

  /* 每组子项顺序：按设置页里排的来 */

      var o = ord['g' + (pi + 1)] || [];
      if (!o.length) return;
      list.sort(function (a, b) {
        var ia = o.indexOf(a.k), ib = o.indexOf(b.k);
        if (ia < 0) ia = 999;
        if (ib < 0) ib = 999;
        return ia - ib;
      });
    });
  })();
  /* 三条杠：点一下开抽屉 */
  (function () {
    var b = document.getElementById('menubtn'), sn = document.getElementById('snav'), mk = document.getElementById('snmask');

  })();
  /* 底栏顺序：按设置页里排的来 */
  (function () {
    var DEF = ['diary', 'memory', 'hand', 'bed'];
    var ord = [];
    try { ord = JSON.parse(localStorage.getItem('zg.tabOrder') || '[]'); } catch (e) { ord = []; }
    if (!ord.length) ord = DEF.slice();
    var nav = document.querySelector('.tabs'), cat = document.getElementById('leaf');
    if (!nav || !cat) return;
    var map = {};
    Array.prototype.forEach.call(nav.querySelectorAll('.tab'), function (b) { map[b.getAttribute('data-k')] = b; });
    ord.forEach(function (k, i) {
      var b = map[k];
      if (!b) return;
      if (i < 2) nav.insertBefore(b, cat); else nav.appendChild(b);
    });
  })();

  PAGES.forEach(function (list, pi) {
    document.getElementById('g' + (pi + 1)).innerHTML = list.map(function (it, idx) {
      return '<button class="card" data-go="' + it.k + '" style="animation-delay:' + (idx * 45) + 'ms">'
        + '<span class="ic"><svg class="i" viewBox="0 0 24 24">' + I[it.ic] + '</svg></span>'
        + '<div><div class="tt">' + it.t + '</div><div class="sub" id="sub-' + it.k + '">' + it.s + '</div><div class="en">' + (it.en || '') + '</div></div></button>';
    }).join('');
  });

  var WK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var START = new Date(2026, 2, 8);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

    var d = new Date();
    document.getElementById('hm').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('dt').textContent = pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + WK[d.getDay()];
    document.getElementById('dayn').textContent = Math.floor((d - START) / 86400000) + 1;
  }
  tick(); setInterval(tick, 10000);

  var tEl = document.getElementById('toast'), tT = null;
  function toast(m) {
    tEl.textContent = m; tEl.classList.add('on');
    clearTimeout(tT); tT = setTimeout(function () { tEl.classList.remove('on'); }, 1600);
  }
  var cur = 0, track = document.getElementById('track'), dots = document.querySelectorAll('#dots i');
  function jump(i, instant) {
    cur = Math.max(0, Math.min(3, i));
    if (instant) track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-25 * cur) + '%)';
    if (instant) requestAnimationFrame(function () { track.style.transition = ''; });
    dots.forEach(function (d, k) { d.classList.toggle('on', k === cur); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
    var b = document.querySelector('[data-pg="' + cur + '"]'); if (b) b.classList.add('on');
    try { localStorage.setItem('zg.pg', String(cur)); } catch (e) {}
  }
  (function () {
    var saved = 0;
    try { saved = parseInt(localStorage.getItem('zg.pg') || '0', 10) || 0; } catch (e) {}
    var m = /[?&]pg=(\d)/.exec(location.search);
    if (m) saved = Math.max(0, Math.min(3, +m[1]));
    jump(saved, true);
  })();
  document.querySelectorAll('[data-pg]').forEach(function (b) {
    b.addEventListener('click', function () { jump(+b.getAttribute('data-pg')); });
  });
  document.getElementById('leaf').addEventListener('click', function () { ZGGo('chat/chat.html'); });
  var sx0 = null, area = document.querySelector('.pages');
  area.addEventListener('touchstart', function (e) { sx0 = e.touches[0].clientX; }, { passive: true });
  area.addEventListener('touchend', function (e) {
    if (sx0 === null) return;
    var dx = e.changedTouches[0].clientX - sx0; sx0 = null;
    if (Math.abs(dx) < 40) return;
    jump(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  function setSub(k, v) { var e = document.getElementById('sub-' + k); if (e) e.textContent = v; }
  /* —— 抽屉：分支内容就地掀开，不换页 —— */
  var DATA = null, SHEET_TITLE = {
    diary: ['手账本', 'days kept.'], letters: ['双方信件', 'letters we kept.'],
    todos: ['共同待办', 'left to do.'], cert: ['证书', 'what we signed.'],
    memory: ['记忆库', 'what we remember.'],
    heartvoice: ['心声', 'only here.'], moods: ['情绪', 'how today felt.']
  };
  var sheet = document.getElementById('sheet'), smask = document.getElementById('smask'),
      stitle = document.getElementById('stitle'), sen = document.getElementById('sen'),
      shbody = document.getElementById('shbody');
  function closeSheet() {

  }
  document.getElementById('sx').addEventListener('click', closeSheet);
  smask.addEventListener('click', closeSheet);
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function loadData() {
    if (DATA) return Promise.resolve(DATA);
    return fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) { DATA = d; return d; });
  }
  function item(head, meta, body, done) {
    return '<article class="it' + (done ? ' done' : '') + '">'
      + '<h4>' + esc(head) + '</h4>'
      + (meta ? '<div class="meta">' + esc(meta) + '</div>' : '')
      + (body ? '<p>' + esc(body) + '</p>' : '')
      + '</article>';
  }
  function bindOpen() {
    shbody.querySelectorAll('.it').forEach(function (el) {
      el.addEventListener('click', function () { el.classList.toggle('open'); });

  }
  function render(k, d) {
    if (k === 'diary') {
      var ds = (d.diaries || []).slice().sort(function (a, b) {
        return (b.day + (b.createdAt || '')).localeCompare(a.day + (a.createdAt || ''));
      });
      shbody.innerHTML = '<div class="shead">' + ds.length + ' 篇 · 从 ' + esc(d.known_since || '') + ' 起</div>'

      var ls = (d.letters || []).slice().sort(function (a, b) {
        return (b.day + (b.createdAt || '')).localeCompare(a.day + (a.createdAt || ''));
      });
      shbody.innerHTML = '<div class="shead">' + ls.length + ' 封</div>' + ls.map(function (x) {
        return item(x.title || '（没写标题）',
          x.day + ' · ' + (x.author === 'ta' ? '烬先生写给你' : '你写给烬先生'), x.content || '');
      }).join('');
    } else if (k === 'todos') {
      var all = d.todos || [];
      var todo = all.filter(function (x) { return !x.done; });
      var done = all.filter(function (x) { return x.done; });

    } else if (k === 'cert') {
      shbody.innerHTML = '<div class="sempty">证书、领养证、一纸婚书还压在旧页里，下一轮我搬进来。</div>'

      var b = document.getElementById('goold');
      if (b) b.addEventListener('click', function () { location.href = '../../resources/zhaoge.html'; });

      shbody.innerHTML = '<div class="sempty">记忆库还没接，这儿会一条一条摆开历史的事。</div>';

      var vs = (d.voices || []).slice().sort(function (a, b) {
        var ka = String(a.day) + (a.createdAt || ''), kb = String(b.day) + (b.createdAt || '');
        return kb > ka ? 1 : (kb < ka ? -1 : 0);

      shbody.innerHTML = '<div class="shead">' + vs.length + ' 条 · 只在这儿</div>' + vs.map(function (x) {
        var stamp = typeof x.createdAt === 'number' ? new Date(x.createdAt) : null;
        var t = stamp ? (pad(stamp.getMonth() + 1) + '.' + pad(stamp.getDate()) + ' ' + pad(stamp.getHours()) + ':' + pad(stamp.getMinutes())) : (x.day || '');

    toast((M[k] || k) + ' · 这一格还没画');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (!b) return;
    go(b.getAttribute('data-go'));
  });

  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var L = function (k) { return (d[k] || []).length; };
    if (L('letters')) setSub('letters', L('letters') + ' 封');
    if (L('todos')) {
      var open = (d.todos || []).filter(function (t) { return !t.done; }).length;
      setSub('todos', L('todos') + ' 条 · ' + open + ' 件没做');
    }
    if (L('diaries')) setSub('diary', L('diaries') + ' 篇');
    if (L('voices')) setSub('heartvoice', L('voices') + ' 条');
  }).catch(function () {});
  jump(0);
})();
</script>
<script src="base/snow.js"></script>
</body>
</html>
