<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌 · 朝歌</title>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --text:#1B3556; --text-soft:#5C789B; --text-faint:#93A9C2;
  --line:rgba(90,130,180,.13); --card:rgba(255,255,255,.74);
  --accent:#2F5F9E; --accent-soft:#E7F0FB;
  --f-en:"Cormorant Garamond","Times New Roman",Georgia,serif;
}
body{
  color:var(--text);
  font:15px/1.65 var(--font-cn);
  min-height:100vh;padding-bottom:106px;
  background:linear-gradient(180deg,#F8FBFF 0%,#EFF5FD 62%,#E9F1FB 100%);
  background-attachment:fixed;
}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:16px 16px 10px;background:rgba(248,251,255,.9);backdrop-filter:blur(14px)}
header a{color:var(--text-soft);text-decoration:none;font-size:19px;line-height:1;opacity:.7}
header b{font-size:15px;letter-spacing:.14em;font-weight:500;flex:none;color:var(--text)}
.hd-en{font:400 10px/1 var(--f-en);letter-spacing:.26em;color:var(--text-faint);
  text-transform:lowercase;margin-left:-2px;position:relative;top:1px}
#q{flex:1;min-width:0;border:0;background:rgba(255,255,255,.72);
  color:var(--text);border-radius:999px;padding:9px 16px;font-size:14px;outline:none}
#q::placeholder{color:#A6B9CE}
#pl,#login{flex:none;border:0;background:rgba(255,255,255,.72);
  color:var(--accent);border-radius:999px;padding:7px 13px;font-size:12px;letter-spacing:.06em}
#pl:active,#login:active{background:var(--accent-soft)}
main{padding:4px 16px}
.sect{display:flex;align-items:baseline;gap:9px;padding:12px 4px 8px}
.sect span{font:500 10px/1 var(--font-cn);letter-spacing:.2em;
  color:var(--text-faint)}
.sect i{font:400 9.5px/1 var(--f-en);letter-spacing:.18em;font-style:normal;
  color:rgba(147,169,194,.9);text-transform:lowercase}
.hint{font:400 9.5px/1 var(--f-en);letter-spacing:.22em;color:#A6B9CE;text-transform:lowercase;
  padding:4px 4px 12px}

.row{display:flex;align-items:center;gap:14px;background:var(--card);
  border-radius:18px;padding:14px 16px;margin-bottom:11px}
.row:active{background:rgba(255,255,255,.92)}
.row .nm{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:500;letter-spacing:.03em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{display:block;font-size:11px;color:var(--text-faint);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.row .dot{width:38px;height:38px;border-radius:12px;flex:none;display:flex;
  align-items:center;justify-content:center;background:rgba(231,240,251,.85);color:var(--accent)}
.row .dot svg{width:16px;height:16px;opacity:.85}
.row .idx{font:400 10px/1 var(--f-en);letter-spacing:.1em;color:#B6C7D9;flex:none;
  position:relative;bottom:8px}
.row.on{background:rgba(255,255,255,.95)}
.row.on .dot{background:var(--accent);color:#fff}
.row.on b{color:var(--accent)}
#acct{flex:none;display:flex;align-items:center}
#me{width:30px;height:30px;border-radius:50%;object-fit:cover;display:none;
  box-shadow:0 2px 9px rgba(47,95,158,.22);border:1.5px solid rgba(255,255,255,.9)}
#me.on{display:block}
.row .add{width:32px;height:32px;flex:none;margin-left:2px;padding:0;border:0;position:relative;
  border-radius:50% 50% 47% 53% / 53% 47% 53% 47%;font-size:0;color:transparent;
  background:linear-gradient(160deg,#EDF5FF 0%,#D9E8FB 100%);
  box-shadow:0 3px 0 rgba(47,95,158,.14), inset 0 1px 0 #fff;
  transition:transform .12s ease, box-shadow .12s ease}
.row .add::before,.row .add::after{content:"";position:absolute;left:50%;top:50%;
  background:var(--accent);border-radius:3px}
.row .add::before{width:12px;height:3px;transform:translate(-50%,calc(-50% + 2px))}
.row .add::after{width:3px;height:12px;transform:translate(-50%,calc(-50% + 2px))}
.row .add:active{transform:scale(.86) rotate(-8deg);box-shadow:0 1px 0 rgba(47,95,158,.18), inset 0 1px 0 #fff}

#bar{position:fixed;left:14px;right:14px;bottom:14px;background:rgba(252,254,255,.94);
  backdrop-filter:blur(16px);border-radius:20px;
  display:flex;align-items:center;gap:14px;padding:11px 14px}
#bar .cover{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;
  background:#26405F;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.6)}
#bar .cover img{width:100%;height:100%;object-fit:cover;display:block}
#bar .meta{flex:1;min-width:0}
#bar .t{font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .a{font-size:10.5px;color:var(--text-faint);margin-top:3px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(47,95,158,.3);
  flex:none;display:flex;align-items:center;justify-content:center;background:transparent;
  color:var(--accent);transition:background .24s,transform .28s cubic-bezier(.34,1.4,.64,1)}
.playbtn svg{width:17px;height:17px}
.playbtn:active{transform:scale(.94)}
.playbtn.on{background:rgba(47,95,158,.08)}
audio{display:none}

/* 详情页 */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FBFDFF 0%,#F0F6FE 52%,#E9F1FB 100%);
  transform:translateY(100%);transition:transform .36s cubic-bezier(.22,.61,.36,1)}
.sheet.on{transform:none}
.sheet header{position:static;background:transparent;border:0;backdrop-filter:none;
  padding:14px 18px 4px}
.sheet header b{flex:1;text-align:center;font:400 10px/1 var(--f-en);letter-spacing:.36em;
  text-transform:uppercase;color:var(--text-faint)}
#closeDetail{font-size:18px;opacity:.55}

/* 唱片 */
.discwrap{display:flex;align-items:center;justify-content:center;padding:18px 0 16px}
.disc{width:236px;height:236px;border-radius:50%;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 4px), #24405F;
  animation:zgspin 26s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.disc .hole{position:absolute;left:50%;top:50%;width:13%;height:13%;border-radius:50%;
  transform:translate(-50%,-50%);background:#F7FBFF;display:flex;align-items:center;
  justify-content:center;color:rgba(47,95,158,.55)}
.disc .hole svg{width:15px;height:15px}
@keyframes zgspin{to{transform:rotate(360deg)}}

.sheet .ttl{font-size:17px;font-weight:500;letter-spacing:.04em;padding:2px 26px 4px;
  color:var(--text)}
.sheet .sub{font-size:11.5px;color:var(--text-faint);letter-spacing:.08em;padding:0 26px 14px}
.prog{display:flex;align-items:center;gap:10px;padding:0 26px 4px;
  font-size:10px;color:var(--text-faint);letter-spacing:.04em}
.prog .track{flex:1;height:2.5px;border-radius:2px;background:rgba(47,95,158,.14);position:relative}
.prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;
  background:var(--accent);transition:width .2s linear}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;padding:12px 0 8px}
.ctrls button{border:0;background:none;color:var(--accent);display:flex;
  align-items:center;justify-content:center}
.ctrls svg{width:22px;height:22px;opacity:.7}
.ctrls #dBtn{width:54px;height:54px;border-radius:50%;border:1px solid rgba(47,95,158,.32);
  background:rgba(255,255,255,.7)}
.ctrls #dBtn svg{width:20px;height:20px;opacity:1}
.tabs{display:flex;gap:20px;padding:6px 26px 8px}
.tabs button{border:0;background:none;font-size:12.5px;letter-spacing:.12em;
  color:var(--text-faint);padding:4px 0;position:relative}
.tabs button.on{color:var(--accent)}
.tabs button.on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1.5px;
  background:var(--accent);border-radius:2px}
.tabs button i{font:400 9px/1 var(--f-en);letter-spacing:.16em;margin-left:6px;
  font-style:normal;text-transform:lowercase;opacity:.72}
.tabs button.on i{opacity:1}
.body{flex:1;overflow-y:auto;padding:10px 26px 60px;scroll-behavior:smooth}
.body .ln{font-size:15px;line-height:2.25;color:#A6B9CE;transition:color .24s,letter-spacing .24s}
.body .ln.on{color:var(--accent);letter-spacing:.03em}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.qrow .n{font:400 11px/1 var(--f-en);letter-spacing:.08em;width:20px;color:#B6C7D9;flex:none}
.qrow .nm{flex:1;min-width:0}
.qrow b{display:block;font-size:13.5px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow span{display:block;font-size:10.5px;color:var(--text-faint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.on .n,.qrow.on b{color:var(--accent)}

.modal{position:fixed;inset:0;z-index:70;background:rgba(27,53,86,.3);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal .box{background:#FBFDFF;border-radius:20px;padding:22px;text-align:center;
  max-width:320px;width:100%}
.modal img{width:220px;height:220px;display:block;margin:0 auto}
.modal .st{font-size:12px;color:var(--text-soft);margin-top:12px;letter-spacing:.06em}
.modal .x{margin-top:14px;border:0;background:var(--accent-soft);
  color:var(--accent);border-radius:999px;padding:8px 18px;font-size:12.5px}
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<header>
  <a href="../home/home.html">←</a><b>歌</b><span class="hd-en">songs</span>
  <input id="q" placeholder="搜歌、搜歌手">
  <button id="pl">歌单</button>
  <div id="acct"><button id="login">登录</button><img id="me" alt="" onclick="void 0"></div>
</header>
<main>
  <div class="sect"><span>一 · 找歌</span><i>songs we borrow.</i></div>
  <div class="hint" id="hint">local media · 3000</div>
  <div id="list"></div>
</main>
<div id="bar">
  <div class="cover" id="openDetail"><img id="barCover" alt="" style="display:none"></div>
  <div class="meta" id="openDetail2">
    <div class="t" id="now">还没放东西</div>
    <div class="a" id="now2">挑一首</div>
  </div>
  <button id="btnPlay" class="playbtn" aria-label="播放"></button>
  <audio id="au" preload="none"></audio>
</div>

<div class="sheet" id="detail">
  <header><a href="javascript:void(0)" id="closeDetail">↓</a><b>now playing</b><span style="width:18px"></span></header>
  <div class="discwrap"><div class="disc" id="dArt"></div></div>
  <div class="ttl" id="lyTitle">还没放东西</div>
  <div class="sub" id="lySub">挑一首</div>
  <div class="prog"><span id="tNow">0:00</span><div class="track" id="tTrack"><div class="fill" id="tFill"></div></div><span id="tAll">0:00</span></div>
  <div class="ctrls">
    <button id="prevBtn" aria-label="上一首"></button>
    <button id="dBtn" aria-label="播放"></button>
    <button id="nextBtn" aria-label="下一首"></button>
  </div>
  <div class="tabs"><button id="tabLy" class="on">词<i>lyrics</i></button><button id="tabQ">排歌表<i>queue</i></button></div>
  <div class="body" id="lyBody"></div>
  <div class="body" id="qBody" style="display:none"></div>
</div>

<div class="modal" id="qrModal">
  <div class="box">
    <img id="qrImg" alt="二维码">
    <div class="st" id="qrSt">用网易云 App 扫一下</div>
    <button class="x" id="qrClose">先不登</button>
  </div>
</div>
<script>
(function () {
  var API = 'http://127.0.0.1:3000';
  var list = document.getElementById('list'), hint = document.getElementById('hint');
  var au = document.getElementById('au'), btn = document.getElementById('btnPlay');
  var q = document.getElementById('q');
  var now = document.getElementById('now'), now2 = document.getElementById('now2');
  var sheet = document.getElementById('detail'), lyBody = document.getElementById('lyBody');
  var qBody = document.getElementById('qBody');
  var lyTitle = document.getElementById('lyTitle'), lySub = document.getElementById('lySub');
  var dArt = document.getElementById('dArt'), barCover = document.getElementById('barCover');
  dArt.innerHTML = '<div class="hole"></div>';
  var tFill = document.getElementById('tFill'), tNow = document.getElementById('tNow'), tAll = document.getElementById('tAll');
  var dBtn = document.getElementById('dBtn');
  var listSongs = [], plist = [], qi = -1, cur = null, lines = [], curLn = -1;
  var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var CK = LS.get('zg.ncmCookie') || window.NCM_COOKIE || '';
  var UID = LS.get('zg.ncmUid') || window.NCM_UID || '';
  function api(path) {
    var u = API + path + (path.indexOf('?') >= 0 ? '&' : '?');
    if (CK) u += 'cookie=' + encodeURIComponent(CK) + '&';
    return fetch(u + 'timestamp=' + Date.now(), { cache: 'no-store' });
  }
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M9.2 7.4c0-1.2 1.3-1.9 2.3-1.3l7 4.5c1 .6 1 2 0 2.6l-7 4.5c-1 .6-2.3-.1-2.3-1.3z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7.5" y="6.5" width="3.4" height="11" rx="1.7" fill="currentColor"/><rect x="13.1" y="6.5" width="3.4" height="11" rx="1.7" fill="currentColor"/></svg>';
  var ICON_NOTE = '<svg viewBox="0 0 24 24"><path d="M14 6.5v8.2a2.6 2.6 0 1 1-2-2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 6.5l4-1.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6.5v11"/><path d="M15 12L7 7.4v9.2z" fill="currentColor" stroke-linejoin="round"/></svg>';
  var ICON_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6.5v11"/><path d="M9 12l8-4.6v9.2z" fill="currentColor" stroke-linejoin="round"/></svg>';
  btn.innerHTML = ICON_PLAY; dBtn.innerHTML = ICON_PLAY;
  document.getElementById('prevBtn').innerHTML = ICON_PREV;
  document.getElementById('nextBtn').innerHTML = ICON_NEXT;
  

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&#34;' })[c]; }); }
  function dur(ms) { var s = Math.floor((ms || 0) / 1000), m = Math.floor(s / 60); s %= 60;
    return m + ':' + (s < 10 ? '0' + s : s); }

  function syncIcon() {
    var icon = au.paused || !au.src ? ICON_PLAY : ICON_PAUSE;
    btn.innerHTML = icon; dBtn.innerHTML = icon;
    btn.classList.toggle('on', !au.paused && !!au.src);
    dArt.classList.toggle('on', !au.paused && !!au.src);
  }
  function parseLrc(t) {
    return String(t || '').split('\n').map(function (l) {
      var m = l.match(/^\[(\d+):(\d+)(?:[.:](\d+))?\]/);
      if (!m) return null;
      var ms = +(m[3] || 0); if (String(m[3] || '').length === 2) ms *= 10;
      return { t: +m[1] * 60 + +m[2] + ms / 1000, s: l.replace(/^\[[^\]]*\]/, '').trim() };
    }).filter(function (x) { return x && x.s; });
  }
  function setCover(url) {
    if (url) {
      dArt.innerHTML = '<img src="' + url + '?param=500y500" alt="">'
        + '<div class="hole"></div>';
      barCover.src = url + '?param=120y120'; barCover.style.display = 'block';
    } else {
      dArt.innerHTML = '<div class="hole">' + ICON_NOTE + '</div>';
      barCover.style.display = 'none';
    }
  }
  function loadLyric() {
    lines = []; curLn = -1;
    lyBody.innerHTML = '<div class="ln">找词中…</div>';
    api('/lyric?id=' + cur.id)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var t = (j.lrc && j.lrc.lyric) || '';
        lines = parseLrc(t);
        if (!lines.length) { lyBody.innerHTML = '<div class="ln">这首没词。</div>'; return; }
        lyBody.innerHTML = lines.map(function (x, i) {
          return '<div class="ln" data-i="' + i + '">' + esc(x.s) + '</div>'; }).join('');
        curLn = -1;
      })
      .catch(function () { lyBody.innerHTML = '<div class="ln">词拿不到。</div>'; });
  }
  function openSheet() {
    if (!cur) return;
    sheet.classList.add('on');
    if (!lines.length) loadLyric();
  }
  function tick() {
    var t = au.currentTime || 0, d = au.duration || 0;
    tFill.style.width = (d ? (t / d * 100) : 0) + '%';
    tNow.textContent = dur(t * 1000); tAll.textContent = dur(d * 1000);
    if (!lines.length) return;
    var i = -1;
    for (var k = 0; k < lines.length; k++) { if (lines[k].t <= t + .2) i = k; else break; }
    if (i === curLn) return;
    curLn = i;
    var on = lyBody.querySelector('.ln.on'); if (on) on.classList.remove('on');
    var el = lyBody.querySelector('.ln[data-i="' + i + '"]');
    if (el) { el.classList.add('on'); if (sheet.classList.contains('on') && lyBody.style.display !== 'none') el.scrollIntoView({ block: 'center' }); }
  }
  function plIndex(id) {
    for (var i = 0; i < plist.length; i++) { if (plist[i].id === id) return i; }
    return -1;
  }
  function renderQueue() {
    if (!plist.length) { qBody.innerHTML = '<div class="ln">还没有排歌。</div>'; return; }
    qBody.innerHTML = plist.map(function (s, i) {
      return '<div class="qrow' + (i === qi ? ' on' : '') + '" data-i="' + i + '">'
        + '<div class="n">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</div><div class="nm"><b>'
        + esc(s.name) + '</b><span>' + esc(s.artist) + (s.album ? ' \u00b7 ' + esc(s.album) : '')
        + '</span></div></div>';
    }).join('');
    Array.prototype.forEach.call(qBody.querySelectorAll('.qrow'), function (el) {
      el.addEventListener('click', function () { playAt(+el.getAttribute('data-i')); });
    });
  }
  function markRows() {
    Array.prototype.forEach.call(list.querySelectorAll('.row'), function (el) {
      var s = listSongs[+el.getAttribute('data-i')];
      el.classList.toggle('on', !!cur && !!s && s.id === cur.id);
    });
  }
  function addTo(song) {
    if (!song) return;
    if (plIndex(song.id) >= 0) { hint.textContent = '\u5df2\u7ecf\u5728\u6392\u6b4c\u8868\u91cc\u4e86'; return; }
    plist.push(song); renderQueue();
    hint.textContent = '\u52a0\u8fdb\u6392\u6b4c\u8868\u4e86\uff0c\u73b0\u5728 ' + plist.length + ' \u9996';
  }
  function playAt(i) {
    if (!plist[i]) return;
    qi = i; cur = plist[i];
    markRows(); renderQueue();
    setCover(cur.pic || '');
    lyTitle.textContent = cur.name;
    lySub.textContent = cur.artist + (cur.album ? ' \u00b7 ' + cur.album : '');
    now.textContent = cur.name; now2.textContent = cur.artist;
    loadLyric();
    hint.textContent = '\u53d6\u5730\u5740\u2026';
    api('/song/url?id=' + cur.id)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var d = (j.data && j.data[0]) || {};
        if (!d.url) { hint.textContent = '\u8fd9\u9996\u6ca1\u7ed9\u5730\u5740\uff08\u7248\u6743\u6216 VIP\uff09\uff0c\u6362\u4e00\u9996'; syncIcon(); return; }
        au.src = d.url; hint.textContent = '\u653e\u7740\u5462';
        au.play().catch(function () { hint.textContent = '\u6309\u4e00\u4e0b\u64ad\u653e\u952e'; });
      })
      .catch(function () { hint.textContent = '\u53d6\u5730\u5740\u5931\u8d25\uff0c3000 \u901a\u4e0d\u901a\uff1f'; });
  }
  function play(song) {
    if (!song) return;
    var i = plIndex(song.id);
    if (i < 0) { plist.push(song); i = plist.length - 1; }
    playAt(i);
  }
  function go(d) {
    if (!plist.length) return;
    var n = (qi + d + plist.length) % plist.length;
    playAt(n);
  }
  function render(songs) {
    listSongs = songs;
    if (!songs.length) { list.innerHTML = '<div class="hint">\u6ca1\u641c\u5230\uff0c\u6362\u4e24\u4e2a\u5b57\u8bd5\u8bd5\u3002</div>'; return; }
    list.innerHTML = songs.map(function (s, i) {
      return '<div class="row" data-i="' + i + '"><div class="dot">' + ICON_NOTE + '</div><div class="nm">'
        + '<b>' + esc(s.name) + '</b><span>' + esc(s.artist) + (s.album ? ' \u00b7 ' + esc(s.album) : '')
        + ' \u00b7 ' + dur(s.duration) + '</span></div><div class="idx">'
        + (i < 9 ? '0' : '') + (i + 1) + '</div>'
        + '<button class="add" data-i="' + i + '">+</button></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.row'), function (el) {
      el.addEventListener('click', function () { play(listSongs[+el.getAttribute('data-i')]); });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.add'), function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        addTo(listSongs[+el.getAttribute('data-i')]);
      });
    });
    markRows(); renderQueue();
  }
  function search(kw) {
    if (!kw) return;
    hint.textContent = '找着…';
    api('/search?keywords=' + encodeURIComponent(kw) + '&limit=30&type=1')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var songs = ((j.result && j.result.songs) || []).map(function (x) {
          return { id: x.id, name: x.name,
            artist: (x.artists || x.ar || []).map(function (a) { return a.name; }).join(' / '),
            album: (x.album && x.album.name) || (x.al && x.al.name) || '',
            pic: (x.al && x.al.picUrl) || (x.album && x.album.picUrl) || '',
            duration: x.duration || x.dt || 0 };
        });
        hint.textContent = songs.length ? ('搜到 ' + songs.length + ' 首') : '没搜到';
        render(songs);
      })
      .catch(function () { hint.textContent = '媒体接口没起来，3000 端口没通。'; list.innerHTML = ''; });
  }
  /* 登录：扫码 */
  var qrModal = document.getElementById('qrModal'), qrImg = document.getElementById('qrImg');
  var qrSt = document.getElementById('qrSt'), qrKey = null, qrTimer = null;
  function loginFlow() {
    qrModal.classList.add('on'); qrSt.textContent = '取二维码…'; qrImg.removeAttribute('src');
    qrKey = null;
    api('/login/qr/key')
      .then(function (r) { return r.json(); })
      .then(function (j) { qrKey = j.data.unikey; return api('/login/qr/create?key=' + qrKey + '&qrimg=true'); })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        qrImg.src = j.data.qrimg;
        qrSt.textContent = '用网易云 App 扫一下';
        fetch('http://127.0.0.1:3011/qr/save', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ img: j.data.qrimg }) })
          .then(function (r) { return r.json(); })
          .then(function () { qrSt.textContent = '码已存进手机，网易云扫一扫选相册那张'; })
          .catch(function () {});
        poll();
      })
      .catch(function () { qrSt.textContent = '取不到二维码，3000 通不通？'; });
  }
  function poll() {
    clearTimeout(qrTimer);
    if (!qrKey) return;
    qrTimer = setTimeout(function () {
      api('/login/qr/check?key=' + qrKey + '&timestamp=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.code === 800) { qrSt.textContent = '码过期了，重开一次'; return; }
          if (j.code === 802) { qrSt.textContent = '扫到了，手机上点确认'; poll(); return; }
          if (j.code === 803) {
            qrSt.textContent = '登上了';
            if (j.cookie) { CK = j.cookie; LS.set('zg.ncmCookie', CK); }
            LS.set('zg.ncmLogin', '1');
            pullStatus();
            setTimeout(function () { qrModal.classList.remove('on'); }, 900);
            return;
          }
          poll();
        }).catch(function () { poll(); });
    }, 3000);
  }
  function showPlaylists() {
    if (!CK) { hint.textContent = '先登录，歌单才拿得到'; return; }
    hint.textContent = '取歌单…';
    api('/user/playlist?uid=' + UID + '&limit=50')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var ps = j.playlist || [];
        hint.textContent = '我的歌单 · ' + ps.length + ' 个';
        list.innerHTML = ps.map(function (p, i) {
          return '<div class="row pl" data-i="' + i + '"><div class="dot">' + ICON_NOTE + '</div><div class="nm">'
            + '<b>' + esc(p.name) + '</b><span>' + (p.trackCount || 0) + ' 首</span></div></div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('.pl'), function (el) {
          el.addEventListener('click', function () { showTracks(ps[+el.getAttribute('data-i')].id); });
        });
      })
      .catch(function () { hint.textContent = '歌单拿不到，登录还在不在？'; });
  }
  function showTracks(pid) {
    hint.textContent = '取曲目…';
    api('/playlist/track/all?id=' + pid + '&limit=200')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var songs = (j.songs || []).map(function (x) {
          return { id: x.id, name: x.name,
            artist: (x.ar || []).map(function (a) { return a.name; }).join(' / '),
            album: (x.al && x.al.name) || '', pic: (x.al && x.al.picUrl) || '',
            duration: x.dt || 0 };
        });
        hint.textContent = songs.length ? ('这张 ' + songs.length + ' 首') : '这张是空的';
        render(songs);
      })
      .catch(function () { hint.textContent = '曲目拿不到'; });
  }
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { q.blur(); search(q.value.trim()); } });
  btn.addEventListener('click', function () {
    if (!au.src) { q.focus(); return; }
    if (au.paused) au.play().catch(function () {}); else au.pause();
  });
  dBtn.addEventListener('click', function () {
    if (!au.src) return;
    if (au.paused) au.play().catch(function () {}); else au.pause();
  });
  document.getElementById('prevBtn').addEventListener('click', function () { go(-1); });
  document.getElementById('nextBtn').addEventListener('click', function () { go(1); });
  au.addEventListener('play', syncIcon); au.addEventListener('pause', syncIcon);
  au.addEventListener('timeupdate', tick); au.addEventListener('loadedmetadata', tick);
  au.addEventListener('ended', function () { syncIcon(); go(1); });
  document.getElementById('openDetail').addEventListener('click', openSheet);
  document.getElementById('openDetail2').addEventListener('click', openSheet);
  document.getElementById('closeDetail').addEventListener('click', function () { sheet.classList.remove('on'); });
  document.getElementById('tTrack').addEventListener('click', function (e) {
    if (!au.duration) return;
    var r = e.currentTarget.getBoundingClientRect();
    au.currentTime = au.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  });
  var tabLy = document.getElementById('tabLy'), tabQ = document.getElementById('tabQ');
  tabLy.addEventListener('click', function () {
    tabLy.classList.add('on'); tabQ.classList.remove('on');
    lyBody.style.display = 'block'; qBody.style.display = 'none';
  });
  tabQ.addEventListener('click', function () {
    tabQ.classList.add('on'); tabLy.classList.remove('on');
    lyBody.style.display = 'none'; qBody.style.display = 'block';
  });
  var meImg = document.getElementById('me'), loginBtn = document.getElementById('login');
  function showMe(p) {
    if (!p || !p.avatarUrl) return;
    meImg.src = p.avatarUrl + '?param=120y120';
    meImg.classList.add('on');
    loginBtn.style.display = 'none';
    meImg.title = p.nickname || '';
  }
  function pullStatus() {
    if (!CK) return;
    api('/login/status').then(function (r) { return r.json(); }).then(function (j) {
      var p = (j.data && j.data.profile) || null;
      if (!p) return;
      UID = p.userId; LS.set('zg.ncmUid', UID);
      showMe(p);
    }).catch(function () {});
  }
  pullStatus();
  meImg.addEventListener('click', showPlaylists);
  document.getElementById('login').addEventListener('click', loginFlow);
  document.getElementById('pl').addEventListener('click', showPlaylists);
  document.getElementById('qrClose').addEventListener('click', function () { qrModal.classList.remove('on'); clearTimeout(qrTimer); });
  window.ZGMedia = { search: search, play: play, api: API };
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
