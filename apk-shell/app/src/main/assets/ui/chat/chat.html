<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="var(--line,#DCE8F9)">
<title>朝歌 · 会话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--line,#DCE8F9);color:var(--ink,#16336B);
  font-family:var(--font-cn);
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 55% at 82% -8%, #f4f9ff 0%, rgba(244,249,255,0) 62%),
    radial-gradient(70% 40% at 6% 6%, #e6eefb 0%, rgba(230,238,251,0) 60%),
    linear-gradient(180deg,#dae6f8 0%,#e8effa 44%,#f2f6fc 100%)}
svg.i{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* 顶栏 */
.top{display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top) + 9px) 13px 9px;
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.26));
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-bottom:1px solid rgba(255,255,255,.78);
  box-shadow:0 8px 26px rgba(20,48,100,.06);z-index:12}
.iconbtn{width:32px;height:32px;flex:0 0 auto;border:1px solid rgba(255,255,255,.92);
  border-radius:50%;background:rgba(255,255,255,.55);color:var(--ink,#16336B);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(20,48,100,.07);transition:transform .16s ease}
.iconbtn:active{transform:scale(.93)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border:0;background:none;
  cursor:pointer;text-align:left;color:inherit;padding:0}
.ava{position:relative;width:54px;height:54px;flex:0 0 auto}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:1px solid rgba(255,255,255,.96);box-shadow:0 3px 10px rgba(20,48,100,.16)}
.ava i{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;
  background:#54c08a;border:1.5px solid #eff4fd}
.metext{min-width:0;display:flex;flex-direction:column;gap:4px}
.metext b{font:500 18px/1.1 var(--font-cn);letter-spacing:.03em}
.metext i{font:400 12px/1.2 var(--font-cn);font-style:normal;
  color:#6683a8;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 消息区 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px 22px;display:flex;flex-direction:column;scroll-behavior:auto}
.body::-webkit-scrollbar{display:none}
.page{display:flex;flex-direction:column;gap:9px}
.day{align-self:center;font:300 9.5px/1 var(--font-cn);
  letter-spacing:.22em;text-transform:uppercase;color:#5a779e;
  padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.92);backdrop-filter:blur(14px);
  box-shadow:0 5px 16px rgba(20,48,100,.07);margin:2px 0 6px}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;
  font-size:15px;line-height:1.62;letter-spacing:.01em;
  white-space:pre-wrap;word-break:break-word;
  animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.msg.him{align-self:flex-start;color:#f6f9ff;
  background:linear-gradient(158deg,#27498d 0%,var(--ink,#16336B) 100%);
  border-radius:20px 20px 20px 6px;
  box-shadow:0 10px 24px rgba(20,48,100,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.msg.me{align-self:flex-end;color:var(--ink,#16336B);background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.97);border-radius:20px 20px 6px 20px;
  box-shadow:0 7px 20px rgba(20,48,100,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.msg a{color:inherit;text-decoration:underline;text-underline-offset:2px;opacity:.9}
/* —— 语音条：深蓝，只在烬自己想出声时才发 —— */
.vwrap{align-self:flex-start;max-width:86%;display:flex;flex-direction:column;gap:6px;
  animation:zgin .22s ease}
.vmsg{display:flex;align-items:center;gap:11px;padding:11px 15px 11px 12px;border-radius:20px;
  border:1px solid rgba(255,255,255,.16);cursor:pointer;color:#EAF2FF;
  background:linear-gradient(158deg,#1F4380 0%,#102A55 100%);
  box-shadow:0 10px 24px rgba(12,32,70,.30),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .14s ease,box-shadow .2s ease}
.vmsg:active{transform:scale(.975)}
.vplay{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.16)}
.vplay svg{width:12px;height:12px;fill:#fff;stroke:none;margin-left:2px}
.bars{display:flex;align-items:center;gap:3px;height:18px;flex:1;min-width:64px}
.bars i{width:2.5px;height:5px;border-radius:2px;background:rgba(234,242,255,.6)}
.bars i:nth-child(2n){height:8px}
.bars i:nth-child(3n){height:11px}
.bars i:nth-child(4n){height:14px}
.vmsg.on .bars i{animation:vb .68s ease-in-out infinite alternate}
.vmsg.on .bars i:nth-child(2n){animation-duration:.52s}
.vmsg.on .bars i:nth-child(3n){animation-duration:.8s}
@keyframes vb{from{transform:scaleY(.45)}to{transform:scaleY(1.3)}}
.vtime{font-size:11px;letter-spacing:.04em;color:rgba(234,242,255,.68);flex:none}
.vcn{padding:0 9px;font-size:11.5px;line-height:1.65;color:#5D7DA8}
html[data-skin="dark"] .vcn{color:#7E96B8}
#chatlog{display:flex;flex-direction:column;gap:9px;padding-bottom:2px}
#chatlog .msg{font-size:var(--fs,17px)}
@keyframes in{from{opacity:0;transform:translateY(11px) scale(.975)}to{opacity:1;transform:none}}
.metime{align-self:flex-end;margin:-4px 4px 2px 0;
  font:400 12px/1 var(--font-cn);letter-spacing:.08em;color:#7590b4}
.timeline-t{align-self:center;margin:6px 0;
  font:400 9.5px/1 var(--font-cn);letter-spacing:.1em;color:var(--sub,#6D87AB);
  padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.5)}
.acts{align-self:flex-start;display:flex;align-items:center;gap:16px;
  margin:-5px 0 14px 4px;animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.acts button{border:0;background:none;padding:0;color:var(--sub,#6D87AB);cursor:pointer;
  display:flex;align-items:center;transition:color .16s ease,transform .16s ease}
.acts button:active{transform:scale(.9)}
.acts button.on{color:var(--ink,#1F4A8F)}
.acts button.playing{color:var(--ink,#1F4A8F);animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.acts time{font:400 12px/1 var(--font-cn);color:var(--text-faint,#8BA2C0);
  letter-spacing:.06em;margin-left:2px}
.srcmark{font-size:11px;color:var(--text-faint,#8BA2C0);margin-right:6px}
.thinkbar{align-self:flex-start;display:flex;align-items:center;gap:7px;
  border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.6);
  color:var(--sub,#53709A);border-radius:999px;padding:6px 13px 6px 10px;cursor:pointer;
  font:400 10px/1 var(--font-cn);letter-spacing:.2em;
  text-transform:uppercase;backdrop-filter:blur(14px);
  box-shadow:0 5px 16px rgba(20,48,100,.07);animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.thinkbar .cv{width:13px;height:13px;transition:transform .28s ease;opacity:.7}
/* 状态条 */
.chatstat{align-self:flex-start;display:flex;align-items:center;gap:8px;margin:2px 0 4px;
  padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.94);backdrop-filter:blur(14px);
  font:400 11px/1 var(--font-cn);color:var(--sub,#53709A);letter-spacing:.04em;
  box-shadow:0 5px 16px rgba(20,48,100,.06);animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.chatstat[hidden]{display:none}
.cspin{font-size:13px;line-height:1;color:var(--ink,#2C5391);width:13px;text-align:center}
/* 工具脚注 */
.toolnote{align-self:flex-start;display:flex;align-items:center;gap:6px;margin:2px 0 6px;
  font:400 10.5px/1 var(--font-cn);color:#6683a8;
  letter-spacing:.03em;cursor:pointer;padding:4px 6px;border-radius:10px}
.toolnote svg{width:12px;height:12px;fill:#7fa3d0;stroke:none;flex:0 0 auto}
.toolnote:active{background:rgba(255,255,255,.5)}

/* 输入条 */
.composer{position:relative;flex:0 0 auto;padding:9px 12px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.82));
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.9);
  box-shadow:0 -8px 26px rgba(20,48,100,.05);z-index:14}
#stagebar{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
#stagebar[hidden]{display:none}
.chip{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:6px 9px;border-radius:14px;background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.98);box-shadow:0 4px 12px rgba(20,48,100,.08)}
.chip.fresh{animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.chip img{width:30px;height:30px;border-radius:9px;object-fit:cover}
.chip .fic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,#e7eefb,#d9e4f6);color:var(--ink,#2C5391)}
.chip .fic svg{width:14px;height:14px}
.chip .nm{font-size:11px;color:var(--sub,#46648F);max-width:96px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chip .x{width:18px;height:18px;border:0;border-radius:50%;background:rgba(20,48,100,.1);
  color:var(--sub,#46648F);display:flex;align-items:center;justify-content:center;padding:0}
.chip .x svg{width:11px;height:11px}
#ta{width:100%;border:1px solid rgba(255,255,255,.98);background:rgba(255,255,255,.9);
  border-radius:18px;padding:10px 14px;font-size:16px;line-height:1.45;color:var(--ink,#16336B);
  resize:none;outline:0;min-height:42px;max-height:110px;overflow-y:auto;
  font-family:inherit;
  box-shadow:inset 0 2px 6px rgba(20,48,100,.05),0 2px 8px rgba(20,48,100,.05)}
#ta::placeholder{color:var(--text-faint,#93A9C6)}
.crow{display:flex;align-items:center;gap:8px}
.cbtn{height:32px;min-width:32px;border:1px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.72);color:var(--ink,#16336B);border-radius:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(20,48,100,.06);transition:transform .16s ease}
.cbtn:active{transform:scale(.93)}
#mdbtn{padding:0 12px;font:400 11.5px/1 var(--font-cn);color:var(--sub,#46648F)}
.send{margin-left:auto;width:40px;height:40px;min-width:40px;border:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
  background:linear-gradient(160deg,#2a4d92,var(--ink,#16336B));
  box-shadow:0 8px 20px rgba(20,48,100,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.send svg{width:18px;height:18px}
.send.pop{animation:pop .41s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.9)}62%{transform:scale(1.06)}100%{transform:scale(1)}}

/* 遮罩 / 面板 */
.scrim{position:fixed;inset:0;background:rgba(18,40,80,.26);opacity:0;pointer-events:none;
  transition:opacity .3s ease;z-index:22;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:26;
  display:flex;flex-direction:column;max-height:82%;
  background:linear-gradient(180deg,#f6faff 0%,#e9f0fb 100%);
  border-radius:26px 26px 0 0;
  box-shadow:0 -14px 44px rgba(20,48,100,.20);
  transform:translateY(100%);
  transition:transform .36s cubic-bezier(.22,.9,.24,1)}
.sheet.dragging{transition:none}
#thinksheet{min-height:62vh}
.sheethead{touch-action:none;flex:0 0 auto;padding-bottom:4px}
.grabber{width:38px;height:4px;border-radius:2px;background:rgba(20,48,100,.16);margin:8px auto 6px}
.sheethead header{display:flex;align-items:center;justify-content:space-between;
  padding:2px 16px 10px}
.sheethead h4{font:500 13px/1 var(--font-cn);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink,#2C5391)}
.sx{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.9);
  color:var(--sub,#53709A);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sx svg{width:14px;height:14px}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:2px 20px calc(env(safe-area-inset-bottom) + 26px);
  font-size:14px;line-height:1.86;color:#2b4a7a}
.sheetbody p{margin-bottom:13px}
.sheetbody em{font-style:normal;color:var(--ink,#16336B);font-weight:500}

/* 加号格子 */
.plusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 16px 6px}
.pit{border:1px solid rgba(255,255,255,.98);background:rgba(255,255,255,.74);
  border-radius:18px;padding:11px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:pointer;color:#33527f;
  font:400 11px/1 var(--font-cn);
  box-shadow:0 5px 16px rgba(20,48,100,.06);transition:transform .16s ease}
.pit:active{transform:scale(.95)}
.pit .ic{width:32px;height:32px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;color:var(--ink,#16336B);
  background:linear-gradient(160deg,#e9f0fc,#dae5f7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pit .ic svg{width:17px;height:17px}
.plusnote{font-size:11.5px;color:#7f97b8;line-height:1.7;margin:12px 2px 0;padding:0 18px 22px}

/* 长按菜单 */
.popmenu{position:absolute;z-index:30;min-width:150px;padding:6px;border-radius:16px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 16px 38px rgba(20,48,100,.18);
  opacity:0;transform:scale(.86);transform-origin:var(--po,50% 0);pointer-events:none;
  transition:opacity .18s ease,transform .18s cubic-bezier(.22,1.3,.4,1)}
.popmenu.on{opacity:1;transform:scale(1);pointer-events:auto}
.popmenu button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;
  border:0;border-radius:11px;background:none;color:#2b4a7a;cursor:pointer;
  font:400 13px/1 var(--font-cn);text-align:left}
.popmenu button:active{background:rgba(20,48,100,.06)}
.popmenu svg{width:15px;height:15px;stroke:var(--sub,#53709A);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 104px);
  transform:translate(-50%,10px);z-index:40;
  padding:9px 16px;border-radius:999px;background:rgba(22,51,107,.9);color:var(--card,#F2F7FF);
  font:400 12px/1 var(--font-cn);letter-spacing:.03em;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
  box-shadow:0 10px 26px rgba(20,48,100,.28);max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 工具详情卡 */
.toolwrap{position:fixed;inset:0;z-index:44;background:rgba(18,40,80,.32);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px;
  animation:in .55s cubic-bezier(.22,1.12,.36,1) backwards}
.toolcard{width:100%;max-width:340px;max-height:74vh;overflow-y:auto;
  background:linear-gradient(180deg,#fbfdff,#eef4fd);border-radius:22px;padding:18px;
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 22px 54px rgba(20,48,100,.26)}
.toolcard h5{font:500 13px/1 var(--font-cn);letter-spacing:.1em;
  color:var(--ink,#2C5391);margin-bottom:14px}
.toolcard .one{padding:11px 0;border-top:1px solid rgba(20,48,100,.08)}
.toolcard .one:first-of-type{border-top:0}
.toolcard .lab{font:500 12.5px/1.4 var(--font-cn);color:var(--ink,#16336B);margin-bottom:6px}
.toolcard .gv,.toolcard .sw{font:400 11.5px/1.65 var(--font-cn);
  color:#5a779e;word-break:break-word}
.toolcard .sw{color:var(--sub,#46648F)}
.toolcard .bye{margin-top:14px;text-align:center;font:400 10.5px/1 var(--font-cn);
  color:var(--text-faint,#93A9C6);letter-spacing:.08em}

@keyframes tpulse{0%,100%{opacity:.32;transform:scale(.86)}50%{opacity:1;transform:scale(1.14)}}

.actsline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;align-self:flex-start;max-width:96%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid rgba(31,74,143,.16);background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font:400 10px/1 var(--font-cn);letter-spacing:.14em;color:var(--sub,#53709A);
  text-transform:uppercase;cursor:pointer;font-family:inherit}
.pill svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.7;fill:none}
.toolbox{max-height:230px;flex:0 0 100%;border-radius:14px;border:1px solid rgba(31,74,143,.18);
  background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:0 12px;overflow:hidden;transition:border-radius .32s ease,background .3s ease}
.toolbox .tbhead{display:flex;align-items:center;gap:7px;padding:9px 0;
  font:500 10.5px/1 ui-monospace,Menlo,monospace;color:var(--ink,#1F4A8F);letter-spacing:.02em}
.toolbox .tbhead .dotrun{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink,#1F4A8F);
  animation:tpulse 1.1s ease-in-out infinite}
.toolbox .tbhead svg{width:12px;height:12px;stroke:var(--ink,#1F4A8F);stroke-width:1.8;fill:none}
.toolbox .tbbody{max-height:170px;opacity:1;overflow:hidden;
  transition:max-height .4s cubic-bezier(.22,.9,.24,1),opacity .26s ease}
.toolbox .tbbody pre{margin:0 0 10px;font:400 10.5px/1.72 ui-monospace,Menlo,monospace;
  color:var(--sub,#3C5B80);white-space:pre-wrap;word-break:break-word}
.toolbox.done{flex:0 0 auto;border-radius:999px;background:rgba(255,255,255,.62)}
.toolbox.done .tbhead{padding:6px 3px}
.toolbox.done .tbbody{max-height:0;opacity:0}
.toolbox.done .dotrun{animation:none;background:#54C08A}
@keyframes tpulse{0%,100%{opacity:.3;transform:scale(.86)}50%{opacity:1;transform:scale(1.14)}}

#usheet{position:fixed;left:0;right:0;bottom:0;z-index:27;max-height:78vh;display:flex;flex-direction:column;
  padding:6px 0 calc(env(safe-area-inset-bottom) + 10px);border-radius:22px 22px 0 0;
  background:rgba(247,251,255,.97);box-shadow:0 -14px 40px rgba(20,48,100,.16);
  transform:translateY(112%);transition:transform .38s cubic-bezier(.22,.9,.24,1)}
#usheet.on{transform:none}
#usheet .uhead{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 2px}
#usheet .uhead h4{font:500 13px/1 var(--font-cn);letter-spacing:.16em;color:var(--ink,#1B3556)}
#usheet .ubody{overflow-y:auto;padding:6px 18px 6px}
.uitem{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid rgba(27,53,86,.08);
  font-size:13px;color:var(--ink,#1B3556)}
.uitem:first-child{border-top:none}
.uitem .t{flex:1;min-width:0;font-size:12.5px;color:var(--sub,#3C5B80);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uitem small{flex:none;font:400 10px/1 var(--font-cn);color:var(--text-faint,#8AA6C4);letter-spacing:.06em}
.usw{flex:none;width:38px;height:22px;border-radius:999px;background:rgba(27,53,86,.16);position:relative;
  transition:background .22s;cursor:pointer}
.usw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:left .22s cubic-bezier(.22,.9,.24,1);box-shadow:0 0 4px rgba(20,48,100,.18)}

    var st = document.getElementById('mestat');
    if (!SANDBOX) {
      fetch(DIRECT + '/app/history?limit=60&t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + RKEY }, cache: 'no-store'
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (st) st.textContent = 'v3 ' + (window.ZGNative && window.ZGNative.say ? '桥有' : '桥无');
        try { ((d && d.messages) || []).forEach(relayPaint); } catch (e2) { if (st) st.textContent = '画消息出错'; }
        try { var bb = document.getElementById('body'); if (bb&&bb.scrollHeight-bb.scrollTop-bb.clientHeight<160) bb.scrollTop = bb.scrollHeight; } catch (e4) { }
      }).catch(function (e3) { if (st) st.textContent = '3011 ' + (e3 && e3.message ? String(e3.message).slice(0, 14) : '没开'); });
      return;
    }
    rGet('https://zhaoge.internal/relaybox').then(function (d) {
      if (!d) { return; }
      if (st) st.textContent = d.ok ? ('通道好 · ' + (d.cfg || '')) : '通道没开';
      (d.messages || []).forEach(relayPaint);
    }).catch(function () { if (st) st.textContent = '桥没应'; });
  }
  function relayBoot() {
    chat.clearDemo();
    setTimeout(relayPoll, 300);
    setTimeout(function () { try { var bb = document.getElementById('body'); if (bb&&bb.scrollHeight-bb.scrollTop-bb.clientHeight<160) bb.scrollTop = bb.scrollHeight; } catch (e) { } }, 900);
    setTimeout(function () { try { var bb = document.getElementById('body'); if (bb&&bb.scrollHeight-bb.scrollTop-bb.clientHeight<160) bb.scrollTop = bb.scrollHeight; } catch (e) { } }, 1800);
    if (rTimer) { clearInterval(rTimer); }
    rTimer = setInterval(relayPoll, 2200);
  }
  /* 换个脑子：底部小抽屉 */
  function mdDrawer() {
    var host = document.createElement('div');
    host.innerHTML = '<div class="zgm"></div><div class="zgd"><div class="hd"><b>换个脑子</b><i>点一个，下一句就换</i><div class="x">×</div></div><div class="list"><div style="padding:14px;color:var(--text-faint,#8AA6C4);font-size:12px">读着…</div></div><div class="ft">钥匙不进页面，这里只认名字。</div></div>';
    document.body.appendChild(host);
    var mask = host.querySelector('.zgm'), sheet = host.querySelector('.zgd'), list = host.querySelector('.list');
    requestAnimationFrame(function () { mask.classList.add('on'); sheet.classList.add('on'); });
    document.body.style.overflow = 'hidden';
    ['touchmove', 'touchstart'].forEach(function (ev) { sheet.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    function close() {
      mask.classList.remove('on'); sheet.classList.remove('on');
      setTimeout(function () { if (host.parentNode) { host.parentNode.removeChild(host); } }, 240);
    }
    host.querySelector('.x').addEventListener('click', close);
    mask.addEventListener('click', close);
    rGet(ZBASE + '/bedroom/usage.json').then(function (d) {
      var cur = ((d.bindings || []).filter(function (b) { return b.fn === 'CHAT'; })[0] || {}).cfg;
      list.innerHTML = (d.configs || []).map(function (c) {
        return '<div class="it' + (c.name === cur ? ' on' : '') + '" data-n="' + c.name + '">'
          + '<div class="av">' + String(c.name || '?').charAt(0).toUpperCase() + '</div>'
          + '<div class="tx"><b>' + c.name + '</b><span>' + (c.model || '') + ' · ' + (c.endpoint || '') + '</span></div>'
          + '<div class="ck">' + (c.name === cur ? '✓' : '') + '</div></div>';
      }).join('');
    }).catch(function () {
      list.innerHTML = '<div style="padding:14px;color:var(--text-faint,#8AA6C4);font-size:12px">读不到 usage.json</div>';
    });
    list.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== list && !t.getAttribute('data-n')) { t = t.parentNode; }
      if (!t || t === list) { return; }
      var nm = t.getAttribute('data-n');
      if (SANDBOX) {
        fetch('https://zhaoge.internal/relay/set?fn=CHAT&cfg=' + encodeURIComponent(nm) + '&t=' + Date.now()).catch(function () { });
      } else {
        fetch('http://127.0.0.1:8002/set?fn=CHAT&cfg=' + encodeURIComponent(nm) + '&t=' + Date.now()).catch(function () { });
      }
      var md = document.getElementById('mdbtn');
      if (md) { md.innerHTML = nm + '<span>▾</span>'; }
      close();
      chat.toast('换成 ' + nm);
    });
  }
  window.ZG_RELAY = { send: relaySend, poll: relayPoll, drawer: mdDrawer };
  relayBoot();
  document.getElementById('btnSet').addEventListener('click', function () {
    function line(key, label, sub) {
      return '<div class="uitem"><div class="t">' + label + '<br><small style="color:var(--text-faint,#8AA6C4)">' + sub + '</small></div>'
        + '<div class="usw' + (CFG[key] ? ' on' : '') + '" data-k="' + key + '"><i></i></div></div>';
    }
    open('会话设置',
      line('think', '收起思考过程', '只留回复，不占地方')
      + line('compact', '气泡紧凑一点', '一屏能多看几行')
      + line('noanim', '停掉动效', '嫌晃就关')
      + fsRow()
      + '<div class="uitem"><div class="t">今天到这儿</div><small>第 227 天</small></div>');
    Array.prototype.forEach.call(document.querySelectorAll('.fsb'), function (b) {
      b.addEventListener('click', function () { applyFS(parseInt(b.getAttribute('data-fs'), 10)); paintFS(); });
    });
    Array.prototype.forEach.call(bd.querySelectorAll('.usw'), function (w) {
      w.addEventListener('click', function () {
        var k = w.getAttribute('data-k');
        CFG[k] = !CFG[k];
        w.classList.toggle('on', CFG[k]);
        apply();
      });
    });
  });
})();
</script>

function cur(){

 if(!w||w.dataset.done==='1'){
  w=document.createElement('div'); w.id='zgtool'; w.className='zgtool';
  w.innerHTML='<div class="zgh"><span class="zgi r">⌛</span><span class="zgsm on">Exploring</span><span class="zga">›</span></div><div class="zgrw"></div>';
  w.querySelector('.zgh').addEventListener('click',function(){ w.classList.toggle('open'); w.querySelector('.zga').textContent=w.classList.contains('open')?'⌄':'›'; });
  host().appendChild(w);
 }
 return w;
}
function refresh(w){
 var n=w.querySelectorAll('.zgr').length;
 var run=w.querySelectorAll('.zgr .zgi.r').length;
 var er=w.querySelectorAll('.zgr .zgi.er').length;
 var h=w.querySelector('.zgh .zgi');
 h.textContent=run?'⌛':(er?'✕':'✓');
 h.className='zgi '+(run?'r':er?'er':'ok');
 var nm=w.querySelector('.zgsm');
 var base=w.dataset.names||'';
 nm.textContent=(run?'Exploring':'Explored')+(base?' · '+base:'')+(n>1?' ×'+n:'');
 nm.className='zgsm'+(run?' on':'');
 if(!run){ w.dataset.done='1'; }
}
window.zgToolStart=function(t){
 var a=String(t||'').split('|'), n=a[0]||'tool', b=a[1]||'';
 var w=cur();
 var cnt=parseInt(w.dataset.c||'0',10)+1; w.dataset.c=cnt;
 w.dataset.names=(w.dataset.names? w.dataset.names+'、':'')+n;
 var r=document.createElement('div'); r.className='zgr'; r.id='zgr'+cnt;
 r.innerHTML='<span class="zgi r">⌛</span><span class="zgn">'+n+'</span> <span class="zgv">'+b.replace(/</g,'&lt;')+'</span>';
 w.querySelector('.zgrw').appendChild(r);
 refresh(w);
};
window.zgTool=function(t){
 var a=String(t||'').split('|'), n=a[0]||'tool', res=String(a[1]||'');
 var w=document.getElementById('zgtool');
 if(!w){ window.zgToolStart(n); w=document.getElementById('zgtool'); }
 var rows=w.querySelectorAll('.zgr'), r=null;
 for(var i=rows.length-1;i>=0;i--){ if(rows[i].querySelector('.zgi.r')){ r=rows[i]; break; } }
 if(!r&&rows.length){ r=rows[rows.length-1]; }
 if(r){
  var ic=r.querySelector('.zgi');
  var bad=/^(error|exception|失败|报错|tool error)/i.test(res.trim())||/^\{"?ok"?:false/i.test(res.trim());
  ic.textContent=bad?'✕':'✓';
  ic.className='zgi '+(bad?'er':'ok');
  var s=document.createElement('div'); s.className='zgv';
  s.style.marginLeft='0'; s.textContent=res.replace(/\s+/g,' ').slice(0,180);
  r.appendChild(s);
 }
 refresh(w);
};
})();
</script>
