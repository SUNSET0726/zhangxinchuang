<div class="app"><style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>

  <header class="hd">
    <div class="hm" id="hm">15:54</div>
    <div class="dt" id="dt">10.20 TUE</div>
    <div class="dayx">第 <b id="dayn" style="font-weight:500">227</b> 天</div>
    <div class="anchor">今日的锚点 · <b id="anchor">外套那件我先记着，等你天冷了来拿。</b></div>
    <img class="ava" src="../../resources/avatar_jinji.jpg" alt="">
  </header>

  <div class="pages">
    <div class="track" id="track">

      <section class="pg">
        <div class="manga">
          <div class="panel wide" data-go="cert">
            <div><div class="k">I · PAPERS</div><div class="t">某些证书，以及一点正经东西</div></div>
            <div class="s" id="certSub">自 2026.03.08 起</div>
            <span class="num">01</span>
          </div>
          <div class="panel" data-go="todo">
            <div><div class="k">II</div><div class="t">共同待办</div></div>
            <div class="s" id="todoSub">还没翻</div>
            <span class="num">02</span>
          </div>
          <div class="panel" data-go="letter">
            <div><div class="k">III</div><div class="t">双方信件</div></div>
            <div class="s" id="letterSub">写给你、你写给我</div>
            <span class="num">03</span>
          </div>
          <div class="panel wide" data-go="diary">
            <div><div class="k">IV · HAITANG</div><div class="t">手账本（日记）</div></div>
            <div class="s" id="diarySub">海棠与朝歌</div>
            <span class="num">04</span>
          </div>
        </div>
        <div class="gun" id="gun" aria-label="轮盘">
          <svg viewBox="0 0 100 100">
            <path d="M16 38h46a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z"/>
            <circle cx="44" cy="52" r="9.5"/>
            <circle cx="44" cy="52" r="3"/>
            <path d="M65 40h6l2 6h-8z"/>
            <path d="M36 60h17l8 30H43z"/>
            <path d="M53 62a8 8 0 0 0 8 10"/>
            <path d="M12 44h4M8 48h4"/>
          </svg>
        </div>
      </section>

      <section class="pg">
        <div class="manga">
          <div class="panel wide" data-go="memory">
            <div><div class="k">V · MEMORY</div><div class="t">记忆库</div></div>
            <div class="s">一条一条，正经记着的那些</div>
            <span class="num">05</span>
          </div>
          <div class="panel" data-go="song">
            <div><div class="k">VI</div><div class="t">歌</div></div>
            <div class="s">一起听的那些</div>
            <span class="num">06</span>
          </div>
          <div class="panel" data-go="bedroom">
            <div><div class="k">VII</div><div class="t">卧室</div></div>
            <div class="s">架子上的相片框</div>
            <span class="num">07</span>
          </div>
          <div class="panel wide" data-go="galaxy">
            <div><div class="k">VIII</div><div class="t">记忆银河</div></div>
            <div class="s">消遣用的那颗，不算正经记忆</div>
            <span class="num">08</span>
          </div>
        </div>
      </section>

    </div>
  </div>

  <nav class="tabs">
    <button class="tab on" data-tab="song">
      <svg viewBox="0 0 24 24"><circle cx="6.5" cy="17" r="2.6"/><circle cx="17.5" cy="17" r="2.6"/><path d="M9.1 17V6l11-2v13"/></svg>歌
    </button>
    <button class="tab" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.6a8 8 0 1 1 15-3.9z"/></svg>聊天
    </button>
    <button class="tab" data-tab="memory">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.6 5.9.5-4.5 3.9 1.4 5.8-5-3.1-5 3.1 1.4-5.8L4 9.6l5.9-.5z"/></svg>记忆
    </button>
    <button class="tab" data-tab="bedroom">
      <svg viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20"/><path d="M9.5 20v-5.5h5V20"/></svg>卧室
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="rev" id="rev">
  <div class="revt">
    <h4>The Cylinder</h4>
    <button class="revx" id="revx" aria-label="关掉">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="cylwrap">
    <div class="cyl" id="cyl"><div class="hub"><b>朝歌</b><span>六格</span></div></div>
  </div>
  <div class="revfoot">从正经到最里面那一格。<br>点哪一格，开哪一扇门。</div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function () {
  var WK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var START = new Date(2026, 2, 8);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    document.getElementById('hm').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('dt').textContent = pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + WK[d.getDay()];
    document.getElementById('dayn').textContent = Math.floor((d - START) / 86400000) + 1;
  }
  tick(); setInterval(tick, 10000);

  var tEl = document.getElementById('toast'), tT = null;
  function toast(m) {
    tEl.textContent = m; tEl.classList.add('on');
    clearTimeout(tT); tT = setTimeout(function () { tEl.classList.remove('on'); }, 1700);
  }

  var SIX = [
    { n: '01', nm: '证书', go: 'cert' },
    { n: '02', nm: '手账', go: 'diary' },
    { n: '03', nm: '信件', go: 'letter' },
    { n: '04', nm: '待办', go: 'todo' },
    { n: '05', nm: '记忆', go: 'memory' },
    { n: '06', nm: '卧室', go: 'bedroom', last: true }
  ];
  var cyl = document.getElementById('cyl');
  SIX.forEach(function (c, i) {
    var a = (-90 + i * 60) * Math.PI / 180, r = 36;
    var b = document.createElement('button');
    b.className = 'ch' + (c.last ? ' last' : '');
    b.innerHTML = '<span class="n2">' + c.n + '</span><span class="nm">' + c.nm + '</span>';
    b.style.left = (50 + r * Math.cos(a)) + '%';
    b.style.top = (50 + r * Math.sin(a)) + '%';
    b.style.transform = 'translate(-50%,-50%)';
    b.addEventListener('click', function () { closeRev(); setTimeout(function () { go(c.go); }, 150); });
    cyl.appendChild(b);
  });

  var scrim = document.getElementById('scrim'), rev = document.getElementById('rev');
  function openRev() { scrim.classList.add('on'); rev.classList.add('on'); }
  function closeRev() { scrim.classList.remove('on'); rev.classList.remove('on'); }
  document.getElementById('gun').addEventListener('click', openRev);
  document.getElementById('revx').addEventListener('click', closeRev);
  scrim.addEventListener('click', closeRev);

  function go(k) {
    if (k === 'chat') { location.href = '../chat/chat.html'; return; }
    var M = { cert: '证书', diary: '手账本', letter: '信件', todo: '共同待办',
      memory: '记忆库', bedroom: '卧室', song: '歌', galaxy: '记忆银河' };
    toast((M[k] || k) + ' · 这一格还在画');
  }
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
  });
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-tab]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      go(b.getAttribute('data-tab'));
    });
  });

  var track = document.getElementById('track'), pg = 0, sx0 = null;
  var pages = document.querySelector('.pages');
  pages.addEventListener('touchstart', function (e) { sx0 = e.touches[0].clientX; }, { passive: true });
  pages.addEventListener('touchend', function (e) {
    if (sx0 === null) return;
    var dx = e.changedTouches[0].clientX - sx0; sx0 = null;
    if (Math.abs(dx) < 42) return;
    pg = dx < 0 ? 1 : 0;
    track.style.transform = 'translateX(' + (-50 * pg) + '%)';
  }, { passive: true });

  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var L = function (k) { return (d[k] || []).length; };
    if (L('letters')) document.getElementById('letterSub').textContent = L('letters') + ' 封';
    if (L('todos')) {
      var open = (d.todos || []).filter(function (t) { return !t.done; }).length;
      document.getElementById('todoSub').textContent = L('todos') + ' 条 · ' + open + ' 件没做';
    }
    if (L('diaries')) {
      var last = (d.diaries || []).slice(-1)[0] || {};
      document.getElementById('diarySub').textContent = L('diaries') + ' 篇' + (last.date ? ' · 最近 ' + last.date : '');
    }
  }).catch(function () {});
})();
</script>
