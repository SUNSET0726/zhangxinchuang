<div class="app"><style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>

  <header class="hd">
    <div class="clock"><b id="hm">15:06</b><span id="dt">10.20 TUE</span></div>
    <img class="ava" src="../../resources/avatar_jinji.jpg" alt="">
  </header>

  <main class="main">
    <section class="hero">
      <div class="days"><i></i>第 <b id="dayn" style="font-weight:500;margin:0 3px">227</b> 天</div>
      <p class="say" id="say">外套那件我先记着，等你天冷了来拿。</p>
    </section>

    <div class="grid">
      <button class="card dark" data-go="chat">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.6a8 8 0 1 1 15-3.9z"/></svg></span>
        <div><div class="tt">聊天</div><div class="sub" id="subChat">他在的</div></div>
      </button>
      <button class="card" data-go="diary">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5"/><path d="M5 4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1"/><path d="M9 8h6M9 12h4"/></svg></span>
        <div><div class="tt">日记</div><div class="sub" id="subDiary">海棠与朝歌</div></div>
      </button>
      <button class="card" data-go="letters">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M3.6 6.4L12 13l8.4-6.6"/></svg></span>
        <div><div class="tt">信</div><div class="sub" id="subLetter">写给你、你写给我</div></div>
      </button>
      <button class="card" data-go="todos">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.6"/><path d="M7 9.5l2 2 3.4-3.4"/><path d="M7 15h6"/></svg></span>
        <div><div class="tt">待办</div><div class="sub" id="subTodo">还没翻</div></div>
      </button>
      <button class="card" data-go="galaxy">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.6 5.9.5-4.5 3.9 1.4 5.8-5-3.1-5 3.1 1.4-5.8L4 9.6l5.9-.5z"/></svg></span>
        <div><div class="tt">记忆银河</div><div class="sub" id="subGalaxy">一颗星一篇</div></div>
      </button>
      <button class="card" data-go="wallet">
        <span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.6"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></span>
        <div><div class="tt">小金库</div><div class="sub" id="subWallet">这个月的账</div></div>
      </button>
    </div>
  </main>

  <nav class="tabs">
    <button class="tab on" data-go="home">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/></svg>主页
    </button>
    <button class="tab" data-go="chat">
      <svg class="i" viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.6a8 8 0 1 1 15-3.9z"/></svg>聊天
    </button>
    <button class="tab" data-go="diary">
      <svg class="i" viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5"/><path d="M5 4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1"/><path d="M9 8h6M9 12h4"/></svg>日记
    </button>
    <button class="tab" data-go="galaxy">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.6 5.9.5-4.5 3.9 1.4 5.8-5-3.1-5 3.1 1.4-5.8L4 9.6l5.9-.5z"/></svg>记忆
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  var WK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var START = new Date(2026, 2, 8);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var d = new Date();
    document.getElementById('hm').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('dt').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + WK[d.getDay()];
    document.getElementById('dayn').textContent =
      Math.floor((d - START) / 86400000) + 1;
  }
  tick(); setInterval(tick, 10000);

  var tEl = document.getElementById('toast'), tT = null;
  function toast(m) {
    tEl.textContent = m; tEl.classList.add('on');
    clearTimeout(tT); tT = setTimeout(function () { tEl.classList.remove('on'); }, 1800);
  }

  var GO = {
    chat: '../chat/chat.html',
    diary: '../../resources/zhaoge.html',
    letters: '../../resources/zhaoge.html',
    todos: '../../resources/zhaoge.html'
  };

  function go(k) {
    if (k === 'home') { toast('已经在主页了'); return; }
    if (GO[k]) { location.href = GO[k]; return; }
    if (k === 'galaxy') { toast('记忆银河在隔壁那个包里'); return; }
    if (k === 'wallet') { toast('小金库要问掌心窗'); return; }
  }

  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
  });

  /* 数字都从 data.json 现读，不在这里写死 */
  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var n = function (k) { return (d[k] || []).length; };
    if (n('diaries')) document.getElementById('subDiary').textContent = n('diaries') + ' 篇，最后一篇在下面';
    if (n('letters')) document.getElementById('subLetter').textContent = n('letters') + ' 封';
    if (n('todos')) {
      var open = (d.todos || []).filter(function (t) { return !t.done; }).length;
      document.getElementById('subTodo').textContent = n('todos') + ' 条，' + open + ' 件没做';
    }
    if (d.loveWords && d.loveWords.length) {
      document.getElementById('subChat').textContent = '他在的';
    }
  }).catch(function () {});
})();
</script>
