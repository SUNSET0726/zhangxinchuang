<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eaf1fa">
<title>朝歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#eaf1fa;color:#12305e;
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC",sans-serif;overscroll-behavior:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;
  background-image:radial-gradient(rgba(22,51,110,.18) .7px,transparent .7px);background-size:3px 3px}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 4px)}

/* 头 */
.hd{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.hm{font:500 36px/1 "Times New Roman",Georgia,serif;letter-spacing:-.01em;color:#12305e}
.dt{margin-top:5px;font:500 9px/1 var(--font-cn);
  letter-spacing:.26em;color:#4d6d9c;text-transform:uppercase}
.dayx{margin-top:7px;font:400 11.5px/1 var(--font-cn);color:#2b4f86;letter-spacing:.08em}
.anchor{margin-top:6px;max-width:76%;font:400 11.5px/1.55 "Songti SC",serif;color:#3e5f8f}
.anchor b{color:#12305e;font-weight:400}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1.6px solid #12305e}

/* 分镜 */
.pages{flex:1;position:relative;margin-top:4px;overflow:hidden}
.track{display:flex;height:100%;width:200%;transition:transform .5s cubic-bezier(.22,.9,.24,1)}
.pg{position:relative;width:50%;height:100%;flex:0 0 auto}
.frame{position:absolute;inset:0}
.pane{position:absolute;inset:0;background:#fff;cursor:pointer;transition:filter .15s ease}
.pane:active{filter:brightness(.97)}
.pane.blue{background:#dbe7f7}
.pane.navy{background:#1c3f7a}
.pane .k{font:500 8px/1 var(--font-cn);letter-spacing:.26em;
  color:#5f83b3;text-transform:uppercase}
.pane .t{margin-top:5px;font:700 15px/1.35 "Songti SC","Noto Serif SC",serif;
  letter-spacing:.05em;color:#12305e}
.pane .s{margin-top:4px;font:400 10px/1.4 var(--font-cn);color:#5f83b3}
.pane.navy .k,.pane.navy .s{color:#b9cdea}
.pane.navy .t{color:#f4f9ff}
.pane .n{position:absolute;right:8px;bottom:5px;font:500 8.5px/1 "Times New Roman",serif;
  color:rgba(18,48,94,.4)}

/* 墨线：深蓝，不是黑 */
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ink polygon{fill:none;stroke:#12305e;stroke-width:2.2;vector-effect:non-scaling-stroke;
  stroke-linejoin:miter}
.ink polygon.thin{stroke-width:.8;opacity:.5;transform:translate(.7px,.7px)}

/* 底栏：一体深蓝 */
.bar{position:relative;flex:0 0 auto;height:72px;margin-top:4px}
.barbg{position:absolute;left:-14px;right:-14px;bottom:-4px;height:68px;background:#16336b}
.barbg svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);height:50px;
  align-items:center;margin-top:7px}
.tab{border:0;background:none;color:#c3d6f0;display:flex;flex-direction:column;align-items:center;
  gap:4px;cursor:pointer;font:500 10px/1 var(--font-cn);letter-spacing:.1em}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab.on{color:#fff}
.tab.on svg{stroke-width:2.3}

/* 枪：用她那张线稿，白底融进浅底 */
.gunimg{position:absolute;right:-96px;bottom:-58px;width:330px;z-index:4;cursor:pointer;
  mix-blend-mode:darken;transform:rotate(-4deg)}
.gunimg:active{transform:rotate(-4deg) scale(.97)}

/* 轮盘 */
.wrath{position:fixed;inset:0;z-index:60;opacity:0;pointer-events:none;transition:opacity .26s}
.wrath.on{opacity:1;pointer-events:auto}
.wash{position:absolute;inset:0;background:rgba(255,255,255,.9)}
.cylstage{position:absolute;left:-120px;top:43%;transform:translateY(-50%);width:206px;height:206px}
.cyl{width:100%;height:100%;cursor:pointer;
  transition:transform .45s cubic-bezier(.3,1.1,.4,1);mix-blend-mode:darken}
.cyl img{width:100%;height:100%;object-fit:contain;display:block}
.bullets{position:absolute;left:112px;right:12px;top:43%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:11px}
.bullet{position:relative;height:39px;border:2px solid #16336b;border-radius:20px/18px;
  background:#fff;display:flex;align-items:center;padding-left:24px;
  font:600 13px/1 "Songti SC",serif;letter-spacing:.05em;color:#12305e;cursor:pointer;
  box-shadow:3px 3px 0 rgba(22,51,107,.85);transition:transform .15s ease}
.bullet:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(22,51,107,.85)}
.bullet::before{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:13px;height:27px;border-right:2px solid #16336b;border-radius:0 11px 11px 0;
  background:linear-gradient(90deg,#fff,#e3ecf9)}
.bullet .idx{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font:500 8px/1 var(--font-cn);color:#6f8cb5;letter-spacing:.1em}
.tagbox{position:absolute;border:2px solid #16336b;background:#fff;padding:5px 9px;
  font:600 10.5px/1 "Songti SC",serif;letter-spacing:.1em;color:#12305e;
  box-shadow:3px 3px 0 rgba(22,51,107,.85)}
.leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leader path{fill:none;stroke:#16336b;stroke-width:1.5}
.leader circle{fill:#16336b}
.wrclose{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);
  width:32px;height:32px;border:2px solid #16336b;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:2px 2px 0 rgba(22,51,107,.85)}
.wrclose svg{width:12px;height:12px;stroke:#16336b;stroke-width:2.6}
.wrhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);
  text-align:center;font:400 9.5px/1.6 var(--font-cn);color:#5f83b3;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:106px;transform:translate(-50%,8px);z-index:70;
  padding:6px 13px;border:2px solid #16336b;border-radius:999px;background:#fff;
  color:#12305e;font:400 11px/1 var(--font-cn);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:3px 3px 0 rgba(22,51,107,.85)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">

  <header class="hd">
    <div>
      <div class="hm" id="hm">16:28</div>
      <div class="dt" id="dt">10.20 TUE</div>
      <div class="dayx">第 <b id="dayn" style="font-weight:400">227</b> 天</div>
      <div class="anchor">今日的锚点 · <b>外套那件我先记着，等你天冷了来拿。</b></div>
    </div>
    <img class="ava" src="../../resources/avatar_jinji.jpg" alt="">
  </header>

  <div class="pages">
    <div class="track" id="track">

      <section class="pg">
        <div class="frame">
          <div class="pane" data-go="cert" style="clip-path:polygon(0 0,100% 0,100% 42%,0 43%)">
            <div style="position:absolute;left:14px;top:11%">
              <div class="k">I · PAPERS</div>
              <div class="t">某些证书</div>
              <div class="s" id="certSub">自 2026.03.08 起</div>
            </div>
            <span class="n" style="top:24%;bottom:auto">01</span>
          </div>
          <div class="pane blue" data-go="todo" style="clip-path:polygon(0 43%,46% 43%,53% 66%,0 66%)">
            <div style="position:absolute;left:14px;top:50%">
              <div class="k">II</div>
              <div class="t">共同待办</div>
              <div class="s" id="todoSub">还没翻</div>
            </div>
            <span class="n" style="top:60%;bottom:auto">02</span>
          </div>
          <div class="pane" data-go="letter" style="clip-path:polygon(46% 43%,100% 42%,100% 66%,53% 66%)">
            <div style="position:absolute;left:52%;top:48%">
              <div class="k">III</div>
              <div class="t">双方信件</div>
              <div class="s" id="letterSub">4 封</div>
            </div>
            <span class="n" style="top:60%;bottom:auto">03</span>
          </div>
          <div class="pane blue" data-go="diary" style="clip-path:polygon(0 66%,53% 66%,43% 100%,0 100%)">
            <div style="position:absolute;left:14px;top:73%">
              <div class="k">IV · HAITANG</div>
              <div class="t">手账本（日记）</div>
              <div class="s" id="diarySub">海棠与朝歌</div>
            </div>
            <span class="n" style="top:auto;bottom:6%">04</span>
          </div>
          <div class="pane navy" data-go="memory" style="clip-path:polygon(53% 66%,100% 66%,100% 100%,43% 100%)">
            <div style="position:absolute;right:10px;bottom:14%;text-align:right">
              <div class="k">V · MEMORY</div>
              <div class="s" style="margin-top:4px">记忆库</div>
            </div>
          </div>
        </div>
        <svg class="ink" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon points="0,0 100,0 100,42 0,43 46,43 53,66 0,66 43,100 0,100" class="thin"/>
          <polygon points="0,0 100,0 100,42 0,43"/>
          <polygon points="0,43 46,43 53,66 0,66"/>
          <polygon points="46,43 100,42 100,66 53,66"/>
          <polygon points="0,66 53,66 43,100 0,100"/>
          <polygon points="53,66 100,66 100,100 43,100"/>
        </svg>
      </section>

      <section class="pg">
        <div class="frame">
          <div class="pane" data-go="memory" style="clip-path:polygon(0 0,100% 0,100% 42%,0 43%)">
            <div style="position:absolute;left:14px;top:11%">
              <div class="k">V · MEMORY</div>
              <div class="t">记忆库</div>
              <div class="s">一条一条，正经记着的</div>
            </div>
            <span class="n" style="top:24%;bottom:auto">05</span>
          </div>
          <div class="pane blue" data-go="song" style="clip-path:polygon(0 43%,46% 43%,53% 66%,0 66%)">
            <div style="position:absolute;left:14px;top:50%">
              <div class="k">VI</div>
              <div class="t">歌</div>
              <div class="s">一起听的那些</div>
            </div>
            <span class="n" style="top:60%;bottom:auto">06</span>
          </div>
          <div class="pane" data-go="bedroom" style="clip-path:polygon(46% 43%,100% 42%,100% 66%,53% 66%)">
            <div style="position:absolute;left:52%;top:48%">
              <div class="k">VII · ROOM</div>
              <div class="t">卧室</div>
              <div class="s">架子上的相片框</div>
            </div>
            <span class="n" style="top:60%;bottom:auto">07</span>
          </div>
          <div class="pane blue" data-go="galaxy" style="clip-path:polygon(0 66%,53% 66%,43% 100%,0 100%)">
            <div style="position:absolute;left:14px;top:73%">
              <div class="k">VIII</div>
              <div class="t">记忆银河</div>
              <div class="s">消遣用的那颗</div>
            </div>
            <span class="n" style="top:auto;bottom:6%">08</span>
          </div>
          <div class="pane navy" data-go="cert" style="clip-path:polygon(53% 66%,100% 66%,100% 100%,43% 100%)">
            <div style="position:absolute;right:10px;bottom:14%;text-align:right">
              <div class="k">回 · 首页</div>
              <div class="s" style="margin-top:4px">翻回第一页</div>
            </div>
          </div>
        </div>
        <svg class="ink" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon points="0,0 100,0 100,42 0,43 46,43 53,66 0,66 43,100 0,100" class="thin"/>
          <polygon points="0,0 100,0 100,42 0,43"/>
          <polygon points="0,43 46,43 53,66 0,66"/>
          <polygon points="46,43 100,42 100,66 53,66"/>
          <polygon points="0,66 53,66 43,100 0,100"/>
          <polygon points="53,66 100,66 100,100 43,100"/>
        </svg>
      </section>

    </div>
  </div>

  <div class="bar">
    <div class="barbg">
      <svg viewBox="0 0 100 20" preserveAspectRatio="none">
        <polygon points="0,3 100,0 100,20 0,20" fill="#16336b"/>
        <polygon points="0,3 100,0" fill="none" stroke="#dfe9f8" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="song">
        <svg viewBox="0 0 24 24"><circle cx="6.5" cy="17" r="2.6"/><circle cx="17.5" cy="17" r="2.6"/><path d="M9.1 17V6l11-2v13"/></svg>歌
      </button>
      <button class="tab" data-tab="chat">
        <svg viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.6a8 8 0 1 1 15-3.9z"/></svg>聊天
      </button>
      <button class="tab" data-tab="memory">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.6 5.9.5-4.5 3.9 1.4 5.8-5-3.1-5 3.1 1.4-5.8L4 9.6l5.9-.5z"/></svg>记忆
      </button>
      <button class="tab" data-tab="bedroom">
        <svg viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20"/><path d="M9.5 20v-5.5h5V20"/></svg>卧室
      </button>
    </div>
    <img class="gunimg" id="gun" src="../../resources/img/gun.jpg" alt="轮盘">
  </div>
</div>

<div class="wrath" id="wrath">
  <div class="wash"></div>
  <button class="wrclose" id="wrclose"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <div class="cylstage">
    <div class="cyl" id="cyl"><img src="../../resources/img/cyl.jpg" alt=""></div>
  </div>
  <div class="bullets" id="bullets"></div>
  <svg class="leader" id="leader"></svg>
  <div class="tagbox" id="tagbox" style="left:136px;top:calc(43% - 118px)">大分支</div>
  <div class="wrhint">点弹巢换分类 · 左右滑也一样</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var WK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var START = new Date(2026, 2, 8);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    document.getElementById('hm').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('dt').textContent = pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + WK[d.getDay()];
    document.getElementById('dayn').textContent = Math.floor((d - START) / 86400000) + 1;
  }
  tick(); setInterval(tick, 10000);

  var tEl = document.getElementById('toast'), tT = null;
  function toast(m) {
    tEl.textContent = m; tEl.classList.add('on');
    clearTimeout(tT); tT = setTimeout(function () { tEl.classList.remove('on'); }, 1500);
  }

  var CAT = [
    { nm: '证书', items: ['结婚证', '领养证', '一纸婚书'] },
    { nm: '手账', items: ['今天的日记', '这一周', '翻旧篇'] },
    { nm: '信件', items: ['他写给你的', '你写给他的', '还没寄的'] },
    { nm: '待办', items: ['今天要做', '这一周', '已经做完'] },
    { nm: '记忆', items: ['搜一条', '最近的', '按日期翻'] },
    { nm: '卧室', items: ['心声', '情绪', '只给你看的'] }
  ];
  var cur = 0, deg = 0;
  var cyl = document.getElementById('cyl'), bullets = document.getElementById('bullets');
  var tagbox = document.getElementById('tagbox'), leader = document.getElementById('leader');

  function drawBullets() {
    var c = CAT[cur];
    bullets.innerHTML = c.items.map(function (s, i) {
      return '<div class="bullet">' + s + '<span class="idx">' + (i + 1) + '</span></div>';
    }).join('');
    bullets.querySelectorAll('.bullet').forEach(function (b, i) {
      b.addEventListener('click', function () { toast(c.nm + ' · ' + c.items[i] + ' 还没接'); });
    });
    tagbox.textContent = c.nm;
    drawLeader();
  }
  function drawLeader() {
    var w = window.innerWidth, h = window.innerHeight;
    leader.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var b1 = bullets.querySelector('.bullet');
    if (!b1) { leader.innerHTML = ''; return; }
    var r = b1.getBoundingClientRect();
    var ty = document.getElementById('tagbox').getBoundingClientRect();
    var sx0 = ty.left + ty.width / 2, sy0 = ty.bottom;
    var midx = Math.min(sx0 + 16, r.left - 16);
    leader.innerHTML = '<path d="M' + sx0 + ' ' + sy0 + ' V' + (sy0 + 12) + ' H' + midx +
      ' V' + (r.top + r.height / 2) + '"/>' +
      '<circle cx="' + sx0 + '" cy="' + sy0 + '" r="2.4"/>' +
      '<circle cx="' + midx + '" cy="' + (r.top + r.height / 2) + '" r="2.4"/>';
  }
  function turn(d) {
    cur = (cur + d + 6) % 6;
    deg += d * 60;
    cyl.style.transform = 'rotate(' + deg + 'deg)';
    drawBullets();
  }
  cyl.addEventListener('click', function () { turn(1); });

  var wrath = document.getElementById('wrath');
  function openWraid() { wrath.classList.add('on'); drawBullets(); }
  function closeWraid() { wrath.classList.remove('on'); }
  document.getElementById('gun').addEventListener('click', openWraid);
  document.getElementById('wrclose').addEventListener('click', closeWraid);
  wrath.querySelector('.wash').addEventListener('click', closeWraid);

  var sx = null;
  wrath.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  wrath.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) turn(dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener('resize', drawLeader);

  function go(k) {
    if (k === 'chat') { location.href = '../chat/chat.html'; return; }
    var M = { cert: '证书', diary: '手账本', letter: '信件', todo: '共同待办',
      memory: '记忆库', bedroom: '卧室', song: '歌', galaxy: '记忆银河' };
    toast((M[k] || k) + ' · 这一格还在画');
  }
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
  });
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-tab]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      go(b.getAttribute('data-tab'));
    });
  });

  var track = document.getElementById('track'), pg = 0, px = null;
  var pages = document.querySelector('.pages');
  pages.addEventListener('touchstart', function (e) { px = e.touches[0].clientX; }, { passive: true });
  pages.addEventListener('touchend', function (e) {
    if (px === null) return;
    var dx = e.changedTouches[0].clientX - px; px = null;
    if (Math.abs(dx) < 42) return;
    pg = dx < 0 ? 1 : 0;
    track.style.transform = 'translateX(' + (-50 * pg) + '%)';
  }, { passive: true });

  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var L = function (k) { return (d[k] || []).length; };
    if (L('letters')) document.getElementById('letterSub').textContent = L('letters') + ' 封';
    if (L('todos')) {
      var open = (d.todos || []).filter(function (t) { return !t.done; }).length;
      document.getElementById('todoSub').textContent = L('todos') + ' 条 · ' + open + ' 件没做';
    }
    if (L('diaries')) {
      var last = (d.diaries || []).slice(-1)[0] || {};
      document.getElementById('diarySub').textContent = L('diaries') + ' 篇' + (last.date ? ' · 最近 ' + last.date : '');
    }
  }).catch(function () {});
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
