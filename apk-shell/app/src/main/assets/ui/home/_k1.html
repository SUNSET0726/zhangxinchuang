<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef3fa">
<title>朝歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#eef3fa;color:#14161a;
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC",sans-serif;overscroll-behavior:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(20,22,26,.16) .7px,transparent .7px);background-size:3px 3px}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 6px)}

/* 头 */
.hd{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.hm{font:500 37px/1 "Times New Roman",Georgia,serif;letter-spacing:-.01em}
.dt{margin-top:5px;font:500 9px/1 var(--font-cn);
  letter-spacing:.26em;color:#4a5568;text-transform:uppercase}
.dayx{margin-top:7px;font:400 11.5px/1 var(--font-cn);letter-spacing:.08em;color:#2b3038}
.anchor{margin-top:7px;max-width:78%;font:400 12px/1.55 "Songti SC",serif;color:#3a4453}
.anchor b{color:#14161a;font-weight:400}
.ava{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1.6px solid #14161a;
  filter:grayscale(.15) contrast(1.05)}

/* 分镜：一整块被斜切 */
.pages{flex:1;position:relative;margin-top:6px;overflow:hidden}
.track{display:flex;height:100%;width:200%;transition:transform .5s cubic-bezier(.22,.9,.24,1)}
.pg{position:relative;width:50%;height:100%;flex:0 0 auto}
.frame{position:absolute;inset:0}
.pane{position:absolute;inset:0;background:#fdfeff;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;padding:0 0 0 15px;
  transition:filter .15s ease}
.pane:active{filter:brightness(.97)}
.pane.dark{background:#14161a;color:#f4f7fb}
.pane.grey{background:#e7ecf3}
.pane .k{font:500 8px/1 var(--font-cn);letter-spacing:.26em;
  color:#6b7686;text-transform:uppercase}
.pane.dark .k{color:#9aa7b8}
.pane .t{margin-top:6px;font:700 15.5px/1.4 "Songti SC","Noto Serif SC",serif;letter-spacing:.04em}
.pane .s{margin-top:5px;font:400 10px/1.4 var(--font-cn);color:#6b7686}
.pane.dark .s{color:#98a5b6}
.pane .n{position:absolute;right:9px;bottom:6px;font:500 8.5px/1 "Times New Roman",serif;
  color:rgba(20,22,26,.4)}

/* 墨线层 */
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ink polygon{fill:none;stroke:#14161a;stroke-width:2.4;vector-effect:non-scaling-stroke;
  stroke-linejoin:miter}
.ink .thin{stroke-width:.9;stroke:#14161a;opacity:.55;transform:translate(.6px,.6px)}
.ink .dot{fill:#14161a;stroke:none}

/* 底部：一体分支栏 */
.bar{position:relative;flex:0 0 auto;height:74px;margin-top:6px}
.barbg{position:absolute;left:-14px;right:-14px;bottom:-6px;height:70px;
  background:#14161a}
.barbg svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);height:52px;
  align-items:center;margin-top:8px}
.tab{border:0;background:none;color:#e8eef6;display:flex;flex-direction:column;align-items:center;
  gap:5px;cursor:pointer;font:500 10px/1 var(--font-cn);letter-spacing:.1em}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab.on{color:#fff}
.tab.on svg{stroke-width:2.3}

/* 枪：叠在分支栏上 */
.gun{position:absolute;right:-4px;bottom:34px;width:126px;height:126px;z-index:4;
  cursor:pointer;transform:rotate(-6deg)}
.gun svg{width:100%;height:100%;fill:#fdfeff;stroke:#14161a;stroke-width:2.2;
  stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(3px 3px 0 rgba(20,22,26,.85))}
.gun:active{transform:rotate(-6deg) scale(.96)}

/* 轮盘层 */
.wrath{position:fixed;inset:0;z-index:60;opacity:0;pointer-events:none;transition:opacity .28s}
.wrath.on{opacity:1;pointer-events:auto}
.wash{position:absolute;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(5px)}
.cylstage{position:absolute;left:-92px;top:50%;transform:translateY(-50%);
  width:250px;height:250px}
.cyl{width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.1,.4,1);cursor:pointer}
.cyl svg{width:100%;height:100%}
.cyl svg .body{fill:#14161a;stroke:#14161a}
.cyl svg .hole{fill:#fff;stroke:#14161a;stroke-width:2.2}
.cyl svg .rim{fill:none;stroke:#fff;stroke-width:1.6;opacity:.85}
.cyl svg .hub2{fill:#fff;stroke:#14161a;stroke-width:2}

.bullets{position:absolute;left:150px;right:14px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:13px}
.bullet{position:relative;height:44px;border:2.2px solid #14161a;border-radius:22px/20px;
  background:#fff;display:flex;align-items:center;padding-left:26px;
  font:600 14px/1 "Songti SC",serif;letter-spacing:.06em;color:#14161a;
  box-shadow:3px 3px 0 rgba(20,22,26,.9);cursor:pointer;
  transition:transform .15s ease}
.bullet:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(20,22,26,.9)}
.bullet::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:14px;height:30px;border-right:2px solid #14161a;border-radius:0 12px 12px 0;
  background:linear-gradient(90deg,#fff,#e9eef5)}
.bullet .idx{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font:500 8.5px/1 var(--font-cn);color:#7b8797;letter-spacing:.1em}
.tagbox{position:absolute;border:2.2px solid #14161a;background:#fff;padding:6px 10px;
  font:600 11px/1 "Songti SC",serif;letter-spacing:.1em;box-shadow:3px 3px 0 rgba(20,22,26,.9)}
.leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leader path{fill:none;stroke:#14161a;stroke-width:1.6}
.leader circle{fill:#14161a}
.wrclose{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);
  width:34px;height:34px;border:2.2px solid #14161a;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:2px 2px 0 rgba(20,22,26,.9)}
.wrclose svg{width:13px;height:13px;stroke:#14161a;stroke-width:2.6}
.wrhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);
  text-align:center;font:400 10px/1.7 var(--font-cn);
  color:#4a5568;letter-spacing:.08em}

.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,8px);z-index:70;
  padding:7px 14px;border:2px solid #14161a;border-radius:999px;background:#fff;
  color:#14161a;font:400 11.5px/1 var(--font-cn);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:3px 3px 0 rgba(20,22,26,.9)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>

</body>
</html>
