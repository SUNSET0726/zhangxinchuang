<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDF5FC">
<title>朝歌 · 心声</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EDF5FC; --text:#1B3556; --text-soft:#4A6B93; --text-faint:#8199B6;
  --hairline:rgba(44,86,140,.16); --accent:#1f4a8f;
  --card-bg:rgba(255,255,255,.58); --card-line:rgba(255,255,255,.9);
  --card-shadow:0 10px 28px rgba(30,64,120,.07);
  --pad:clamp(14px,4vw,24px);
  --font-cn:system-ui,"HONOR Sans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-cn);
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(237,245,252,.62) 0%,rgba(237,245,252,.24) 30%,rgba(237,245,252,.10) 66%,rgba(237,245,252,.52) 100%),
    url('../../resources/img/tidal/chat-light.webp');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 6px}
.back{width:34px;height:34px;flex:none;border:1px solid var(--card-line);border-radius:50%;
  background:rgba(255,255,255,.7);color:var(--text);display:grid;place-items:center;cursor:pointer}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font:600 clamp(15px,4vw,17px)/1.3 var(--font-cn);letter-spacing:.06em}
.ttl em{display:block;margin-top:3px;font:400 clamp(8.5px,2.2vw,10px)/1.3 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.08em;color:var(--text-faint);font-style:normal}
.segs{display:flex;gap:7px;padding:2px var(--pad) 10px;flex:0 0 auto}
.seg{border:1px solid var(--card-line);background:rgba(255,255,255,.62);color:var(--text-soft);
  border-radius:999px;padding:6px 12px;font:400 10.5px/1 var(--font-cn);letter-spacing:.04em;cursor:pointer}
.seg.on{background:var(--accent);border-color:transparent;color:#fff}
.list{flex:1;overflow-y:auto;padding:4px var(--pad) calc(env(safe-area-inset-bottom) + 20px)}
.list::-webkit-scrollbar{display:none}
.stat{margin:2px 0 10px;font:400 9.5px/1 var(--font-cn);letter-spacing:.2em;color:var(--text-faint)}
.v{background:var(--card-bg);border:1px solid var(--card-line);border-radius:15px;
  box-shadow:var(--card-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 13px;margin-bottom:8px}
.v .top{display:flex;align-items:baseline;gap:8px}
.v .t{font:400 9.5px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;color:var(--text-faint)}
.v .k{margin-left:auto;font:400 9px/1 var(--font-cn);color:var(--accent);opacity:.8}
.v p{margin-top:6px;font:400 clamp(11px,2.8vw,12px)/1.8 var(--font-cn);color:var(--text);white-space:pre-wrap}
.v.fav{border-left:2px solid rgba(31,74,143,.35)}
.empty{padding:28px 0;text-align:center;font:400 11px/1.8 var(--font-cn);color:var(--text-faint)}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="back" id="back" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl"><h1>心声</h1><em>only here.</em></div>
  </header>
  <div class="segs">
    <button class="seg on" data-f="all">全部</button>
    <button class="seg" data-f="fav">收藏的</button>
  </div>
  <main class="list" id="list">
    <div class="stat" id="stat">…</div>
  </main>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var list = $('#list');
  $('#back').addEventListener('click', function () { ZGBack(); });
  var KM = { care: '在意', soft: '软', sad: '难过', happy: '开心', calm: '平静', angry: '生气', tired: '累' };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  fetch('../../data.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) {
      var all = (d.voices || []).slice().sort(function (a, b) {
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
      $('#stat').textContent = all.length + ' 条 · 只在这儿说';
      function paint(f) {
        var sub = f === 'fav' ? all.filter(function (x) { return x.fav; }) : all;
        list.querySelectorAll('.v, .empty').forEach(function (n) { n.remove(); });
        if (!sub.length) { list.insertAdjacentHTML('beforeend', '<div class="empty">这一栏是空的。</div>'); return; }
        list.insertAdjacentHTML('beforeend', sub.map(function (x) {
          var t = typeof x.createdAt === 'number' ? new Date(x.createdAt) : null;
          var stamp = t ? (pad(t.getMonth() + 1) + '.' + pad(t.getDate()) + ' ' + pad(t.getHours()) + ':' + pad(t.getMinutes()))
            : (x.day || '');
          return '<article class="v' + (x.fav ? ' fav' : '') + '">'
            + '<div class="top"><span class="t">' + esc(stamp) + '</span>'
            + '<span class="k">' + esc(KM[x.mood] || x.mood || '') + '</span></div>'
            + '<p>' + esc(x.text || '') + '</p></article>';
        }).join(''));
      }
      document.querySelectorAll('.seg').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.seg').forEach(function (o) { o.classList.remove('on'); });
          b.classList.add('on'); paint(b.getAttribute('data-f')); list.scrollTop = 0;
        });
      });
      paint('all');
    })
    .catch(function () { $('#stat').textContent = 'data.json 读不到了'; });
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
