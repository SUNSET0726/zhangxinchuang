<title>拍立得 · 纪烬的脑子</title>
<style>
@import url('../base/theme.css?v=1021a');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --text:#1B3556; --text-soft:#5C789B; --text-faint:#93A9C2;
  --line:rgba(90,130,180,.13); --card:rgba(255,255,255,.74);
  --accent:#2F5F9E; --accent-soft:#E7F0FB;
  --f-en:"Cormorant Garamond","Times New Roman",Georgia,serif;
}
body{color:var(--text);font:15px/1.65 var(--font-cn);min-height:100vh;padding-bottom:40px;
  background:linear-gradient(180deg,#F8FBFF 0%,#EFF5FD 62%,#E9F1FB 100%);
  background-attachment:fixed}
main,header{position:relative;z-index:2}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:16px 16px 10px;background:rgba(248,251,255,.9);backdrop-filter:blur(14px)}
header a{color:var(--text-soft);text-decoration:none;font-size:19px;line-height:1;opacity:.7}
header b{font-size:15px;letter-spacing:.14em;font-weight:500;flex:none}
.hd-en{font:400 10px/1 var(--f-en);letter-spacing:.26em;color:var(--text-faint);
  text-transform:lowercase;position:relative;top:1px}
main{padding:4px 16px}
.lead{font-size:11.5px;color:var(--text-faint);letter-spacing:.04em;line-height:1.9;
  padding:12px 6px 14px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.sk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
  padding:13px 15px;margin-bottom:9px}
.sk .ic{width:34px;height:34px;border-radius:11px;flex:none;background:rgba(231,240,251,.9);
  display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:.75}
.sk .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.sk .ln{flex:1;min-width:0}
.sk i{display:block;height:9px;border-radius:5px;background:rgba(90,130,180,.14);
  animation:sh 1.9s ease-in-out infinite}
.sk i+i{margin-top:8px;width:58%;height:7px;animation-delay:.25s}
@keyframes sh{0%,100%{opacity:.55}50%{opacity:.95}}
.tip{font-size:10.5px;color:#A6B9CE;letter-spacing:.05em;padding:16px 6px 0;line-height:1.9}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.8);color:var(--text);padding:14px;font:14px/1.9 var(--font-cn);
  outline:none;resize:vertical}
textarea::placeholder{color:#A6B9CE}
.btn{margin-top:12px;border:0;border-radius:999px;padding:10px 22px;font:13px/1 var(--font-cn);
  letter-spacing:.08em;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--accent);margin-left:8px}
.saved{font-size:11px;color:var(--text-faint);margin-top:10px;letter-spacing:.04em}
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>

<div class="lead">近七天每次换窗带回了什么。</div>
