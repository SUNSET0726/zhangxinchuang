<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>记忆银河 · 朝歌</title>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --text:#1B3556; --text-soft:#5C789B; --text-faint:#93A9C2;
  --line:rgba(90,130,180,.13); --card:rgba(255,255,255,.74);
  --accent:#2F5F9E; --accent-soft:#E7F0FB;
  --f-en:"Cormorant Garamond","Times New Roman",Georgia,serif;
}
body{color:var(--text);font:15px/1.65 var(--font-cn);
  min-height:100vh;padding-bottom:40px;
  background:linear-gradient(180deg,#F8FBFF 0%,#EFF5FD 62%,#E9F1FB 100%);
  background-attachment:fixed}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:16px 16px 10px;background:rgba(248,251,255,.9);backdrop-filter:blur(14px)}
header a{color:var(--text-soft);text-decoration:none;font-size:19px;line-height:1;opacity:.7}
header b{font-size:15px;letter-spacing:.14em;font-weight:500;flex:none}
.hd-en{font:400 10px/1 var(--f-en);letter-spacing:.26em;color:var(--text-faint);
  text-transform:lowercase;position:relative;top:1px}
#q{flex:1;min-width:0;border:0;background:rgba(255,255,255,.72);color:var(--text);
  border-radius:999px;padding:9px 16px;font-size:14px;outline:none}
#q::placeholder{color:#A6B9CE}
main{padding:4px 16px}
.sect{display:flex;align-items:baseline;gap:9px;padding:12px 4px 8px}
.sect span{font:500 10px/1 var(--font-cn);letter-spacing:.2em;color:var(--text-faint)}
.sect i{font:400 9.5px/1 var(--f-en);letter-spacing:.18em;font-style:normal;
  color:rgba(147,169,194,.9);text-transform:lowercase}
.chips{display:flex;gap:8px;padding:2px 0 10px}
.chips button{border:0;background:rgba(255,255,255,.7);color:var(--text-faint);
  border-radius:999px;padding:6px 13px;font-size:10.5px;letter-spacing:.1em}
.chips button.on{background:var(--accent);color:#fff}
.sky{position:relative;height:300px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 130% at 50% -10%,#1B3A5E 0%,#122541 46%,#0C1829 100%)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky .ring{position:absolute;left:50%;top:50%;width:130%;height:60%;border-radius:50%;
  transform:translate(-50%,-50%) rotate(-12deg);
  background:radial-gradient(closest-side,rgba(140,190,250,.14),rgba(140,190,250,0) 72%)}
.sky .cap{position:absolute;left:16px;bottom:12px;
  font:400 9px/1.5 var(--f-en);letter-spacing:.24em;color:rgba(190,215,245,.6);
  text-transform:lowercase}
.sky .cap b{font-weight:400;color:rgba(220,236,255,.9)}
#list{margin-top:14px}
.card{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.card .t{display:flex;align-items:baseline;gap:8px}
.card b{font-size:14px;font-weight:500;letter-spacing:.03em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dy{font:400 10px/1 var(--f-en);letter-spacing:.14em;color:#B6C7D9;flex:none}
.card .m{margin-top:6px;font:400 9.5px/1 var(--f-en);letter-spacing:.16em;
  color:rgba(147,169,194,.95);text-transform:lowercase}
.card p{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--text-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.on p{-webkit-line-clamp:99;display:block}
.card.on b{color:var(--accent)}
.empty{font-size:12px;color:var(--text-faint);letter-spacing:.1em;padding:20px 4px}
.floaty{z-index:0}
main,header{position:relative;z-index:2}
</style>
<style id="zgfont">@font-face{font-family:'ZGSans';src:url('/ui/fonts/zgsans.woff2') format('woff2');font-display:swap;font-weight:100 900}
html,body,div,span,p,a,button,input,textarea,h1,h2,h3,h4,h5,h6,label,li,td,th,strong,em,small{font-family:'ZGSans',sans-serif!important}</style>
</head>
<body>
<header>
  <a href="../home/home.html">←</a><b>记忆银河</b><span class="hd-en">memories</span>
  <input id="q" placeholder="搜一颗星">
</header>
<main>
  <div class="sect"><span>四 · 银河</span><i>the nights we kept.</i></div>
  <div class="chips" id="chips"></div>
  <div class="sky" id="skyBox"><canvas id="sky"></canvas><div class="ring"></div>
    <div class="cap">stars <b id="cnt">0</b> · <b>zhaoge</b> archive</div>
  </div>
  <div id="list"></div>
</main>
<script>
(function () {
  var cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  var list = document.getElementById('list'), q = document.getElementById('q');
  var cnt = document.getElementById('cnt'), box = document.getElementById('skyBox');
  var all = [], view = [], sel = null, pos = {}, pick = 'all';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&#34;' })[c]; }); }
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) / 4294967295;
  }
  function fam(d) {
    var s = String(d || '');
    if (/\u6e29\u67d4|\u8f6f|\u5b89\u5fc3|\u5b89\u7a33|\u7a33|\u5e73\u9759|\u62a4|\u8ba4|\u65e5\u5e38|\u7737|\u575a\u5b9a/.test(s)) return 'warm';
    if (/\u9178|\u75bc|\u95f7|\u81ea\u8d23|\u6094|\u96be|\u54ed/.test(s)) return 'ache';
    return 'other';
  }
  function tint(d) {
    var f = fam(d);
    return f === 'warm' ? '#8FBEF5' : (f === 'ache' ? '#B4A6EE' : '#A6C4E4');
  }
  function fit() {
    var r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function posOf(s) { return pos[s.id] || { x: .5, y: .5 }; }
  function layout() {
    view.forEach(function (s) {
      var t = hash(s.id);
      var f = fam(s.domain);
      var shift = f === 'ache' ? -.055 : (f === 'warm' ? .045 : 0);
      var dx = (hash(s.id + 'x') - .5) * .16;
      var dy = (hash(s.id + 'y') - .5) * .18;
      pos[s.id] = {
        x: Math.min(.94, Math.max(.06, .06 + .86 * t + dx)),
        y: Math.min(.88, Math.max(.12, .2 + .56 * t + dy + shift))
      };
    });
  }
  function dust(w, h) {
    for (var i = 0; i < 170; i++) {
      var rx = hash('d' + i), ry = hash('e' + i);
      ctx.globalAlpha = .07 + .13 * hash('f' + i);
      ctx.fillStyle = '#CFE4FF';
      ctx.beginPath();
      ctx.arc(rx * w, ry * h, .6 + hash('g' + i) * 1.1, 0, 6.2832);
      ctx.fill();
    }
  }
  function draw() {
    var r = box.getBoundingClientRect(), w = r.width, h = r.height;
    ctx.clearRect(0, 0, w, h);
    layout();
    dust(w, h);
    /* 只在贴得近的同族之间连线，最多两根 */
    var edges = [];
    for (var i = 0; i < view.length; i++) {
      for (var j = i + 1; j < view.length; j++) {
        if (fam(view[i].domain) !== fam(view[j].domain)) continue;
        var A = pos[view[i].id], B = pos[view[j].id];
        var dx = A.x - B.x, dy = A.y - B.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d > .19) continue;
        edges.push({ a: view[i].id, b: view[j].id, d: d });
      }
    }
    edges.sort(function (x, y) { return x.d - y.d; });
    var deg = {};
    ctx.lineWidth = .6;
    ctx.strokeStyle = 'rgba(196,222,255,.14)';
    ctx.beginPath();
    edges.forEach(function (e) {
      if ((deg[e.a] || 0) >= 2 || (deg[e.b] || 0) >= 2) return;
      deg[e.a] = (deg[e.a] || 0) + 1; deg[e.b] = (deg[e.b] || 0) + 1;
      var A = pos[e.a], B = pos[e.b];
      ctx.moveTo(A.x * w, A.y * h); ctx.lineTo(B.x * w, B.y * h);
    });
    ctx.stroke();
    view.forEach(function (s) {
      var p = posOf(s);
      var x = p.x * w, y = p.y * h;
      var big = s.pinned || s.importance >= 3;
      var rad = (big ? 2.1 : 1.3) * (s.id === sel ? 2 : 1);
      ctx.beginPath();
      ctx.fillStyle = s.id === sel ? '#FFFFFF' : tint(s.domain);
      ctx.globalAlpha = s.id === sel ? 1 : (big ? .9 : .55);
      ctx.arc(x, y, rad, 0, 6.2832);
      ctx.fill();
      if (big || s.id === sel) {
        var g = ctx.createRadialGradient(x, y, 0, x, y, rad * 5.5);
        g.addColorStop(0, s.id === sel ? 'rgba(255,255,255,.45)' : 'rgba(160,200,245,.26)');
        g.addColorStop(1, 'rgba(160,200,245,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, rad * 5.5, 0, 6.2832); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
  function day(s) {
    var d = String(s.created || '').slice(0, 10).split('-');
    return d.length === 3 ? d[1] + '.' + d[2] : '';
  }
  function renderList() {
    cnt.textContent = view.length;
    if (!view.length) { list.innerHTML = '<div class="empty">这颗还没落下来。</div>'; return; }
    list.innerHTML = view.map(function (s) {
      return '<div class="card" data-id="' + esc(s.id) + '"><div class="t"><b>' + esc(s.name)
        + '</b><span class="dy">' + day(s) + '</span></div>'
        + '<div class="m">' + esc(s.domain || 'memory') + ' \u00b7 ' + '\u25cf'.repeat(Math.min(5, Math.max(1, s.importance || 1))) + '</div>'
        + '<p>' + esc(String(s.content || '').replace(/\s+/g, ' ')) + '</p></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.card'), function (el) {
      el.addEventListener('click', function () { el.classList.toggle('on'); });
    });
  }
  function focus(id) {
    sel = id; draw();
    var el = list.querySelector('.card[data-id="' + id + '"]');
    if (el) {
      Array.prototype.forEach.call(list.querySelectorAll('.card'), function (c) { c.classList.remove('on'); });
      el.classList.add('on');
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  box.addEventListener('click', function (e) {
    var r = box.getBoundingClientRect(), w = r.width, h = r.height;
    var mx = e.clientX - r.left, my = e.clientY - r.top, best = null, bd = 1e9;
    view.forEach(function (s) {
      var p = pos[s.id] || { x: .5, y: .5 };
      var dx = p.x * w - mx, dy = p.y * h - my, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = s; }
    });
    if (best && bd < 900) focus(best.id);
  });
  q.addEventListener('input', applyPick);
  function applyPick() {
    var k = q.value.trim().toLowerCase();
    view = all.filter(function (s) {
      var okPick = pick === 'all' || fam(s.domain) === pick;
      var okText = !k || (s.name + ' ' + (s.content || '') + ' ' + (s.domain || ''))
        .toLowerCase().indexOf(k) >= 0;
      return okPick && okText;
    });
    sel = null; renderList(); draw();
  }
  var chips = document.getElementById('chips');
  var PICKS = [['all', '\u5168\u90e8'], ['warm', '\u6e29\u67d4'], ['ache', '\u9178\u6da9']];
  function renderChips() {
    chips.innerHTML = PICKS.map(function (p) {
      return '<button data-p="' + p[0] + '"' + (pick === p[0] ? ' class="on"' : '') + '>' + p[1] + '</button>';
    }).join('');
    Array.prototype.forEach.call(chips.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        pick = b.getAttribute('data-p'); renderChips(); applyPick();
      });
    });
  }
  function boot(d) {
    all = (d.stars || []).slice().sort(function (a, b) {
      return String(b.created || '').localeCompare(String(a.created || ''));
    });
    renderChips(); view = all; renderList(); fit();
  }
  fetch('stars.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(boot)
    .catch(function () {
      all = []; view = [];
      list.innerHTML = '<div class="empty">stars.json 读不到，先同步一次。</div>';
      fit();
    });
  window.addEventListener('resize', fit);
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
