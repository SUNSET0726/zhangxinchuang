<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14284f">
<meta http-equiv="Cache-Control" content="no-store">
<title>海棠与朝歌</title>
<style>
@font-face{font-family:'GreatVibes';src:url('fonts/GreatVibes.ttf') format('truetype');font-display:block;font-weight:400}
@font-face{font-family:'Playball';src:url('fonts/Playball.ttf') format('truetype');font-display:block;font-weight:400}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#d9e5f6;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.stage{position:fixed;inset:0;overflow:hidden;background:#d9e5f6;touch-action:none}

/* ================= 画面层：整幅平铺，不裁不拉 ================= */
.layer{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;
  opacity:0;pointer-events:none;-webkit-user-select:none;user-select:none;
  filter:brightness(1.09) saturate(.9) contrast(1.01);
  -webkit-backface-visibility:hidden;backface-visibility:hidden}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* 第一位次：上浮 + 渐显 */
.layer.rise{animation:riseIn 1.3s cubic-bezier(.22,.68,.2,1) var(--d,0s) both}
/* 第二位次 / 第三位次 / 底图：只渐显 */
.layer.fade{animation:fadeIn 1.15s ease var(--d,0s) both}
/* 第四位次：上滑之后才出现 */
.layer.fourth{animation:none}
.layer.fourth.on{animation:fadeIn 1.05s ease both}

.stack{position:absolute;top:8.6%;left:0;right:0;width:max-content;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  opacity:0;animation:dropIn 1.15s cubic-bezier(.22,.68,.2,1) 4.3s both}
@keyframes dropIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* ================= 顶部时间（翻牌） ================= */
.clock{position:relative;
  display:flex;align-items:center;gap:15px;
  padding:12px 24px;border-radius:999px;color:#16336b;white-space:nowrap;
  font-family:"Times New Roman",Georgia,"Songti SC",serif;
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:0 10px 32px rgba(8,22,50,.26),
             inset 0 1px 0 rgba(255,255,255,.5),
             inset 0 -1px 0 rgba(255,255,255,.12)}
.fc{display:flex;justify-content:center;align-items:baseline;
  font-size:37px;line-height:1;font-weight:400;letter-spacing:.015em;
  text-shadow:0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(255,255,255,.35)}
.fc .fl{position:relative;display:inline-block;width:.62em;text-align:center;
  transform-origin:50% 50%;backface-visibility:hidden}
.fc .fl::after{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;
  background:rgba(20,48,100,.16);pointer-events:none}
.fc .fl.turn{animation:turnA .38s cubic-bezier(.4,.05,.2,1)}
@keyframes turnA{
  0%{transform:rotateX(0);opacity:1}
  45%{transform:rotateX(-84deg);opacity:.25}
  100%{transform:rotateX(0);opacity:1}
}
.fc .colon{display:inline-block;width:.30em;text-align:center;
  font-size:.72em;opacity:.75;transform:translateY(-.06em)}
.clock .rule{width:1px;height:26px;background:rgba(20,48,100,.22);margin:0;flex:0 0 auto}
  .clock .meta{text-align:left;line-height:1}
  .clock .d{font:300 11px/1 -apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    letter-spacing:.22em;opacity:.85;text-transform:uppercase}
  .clock .n{font:300 9.5px/1 -apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    letter-spacing:.18em;opacity:.7;margin-top:6px}

/* 两个圆形玻璃球 */
.dots{display:flex;align-self:flex-end;gap:10px;}
.dot{position:relative;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.62);
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:0 10px 32px rgba(8,22,50,.26),
             inset 0 1px 0 rgba(255,255,255,.5),
             inset 0 -1px 0 rgba(255,255,255,.12);
  -webkit-tap-highlight-color:transparent;transition:transform .18s ease}
.dot:active{transform:scale(.94)}
.dot svg{width:18px;height:18px;stroke:#16336b;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.95}

/* 未读角标 */
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;
  padding:0 5px;border-radius:999px;background:#e8453c;color:#fff;
  font:600 10px/18px -apple-system,"Helvetica Neue","PingFang SC",sans-serif;
  text-align:center;opacity:0;transform:scale(.6);
  box-shadow:0 3px 10px rgba(232,69,60,.5);transition:opacity .35s ease,transform .35s cubic-bezier(.22,1.4,.4,1)}
.badge.on{opacity:1;transform:scale(1)}

/* ================= 底部进度条 ================= */
.bar{position:absolute;left:50%;bottom:8.5%;transform:translateX(-50%);
  width:46%;height:1.5px;background:rgba(255,255,255,.16);border-radius:2px;
  opacity:0;overflow:hidden;
  animation:barIn .6s ease .22s both, barOut .8s ease 4.05s both}
.bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,.55),#fff);
  animation:fillUp 2.85s cubic-bezier(.42,.04,.18,1) .3s both}
@keyframes barIn{from{opacity:0}to{opacity:1}}
@keyframes barOut{from{opacity:1}to{opacity:0}}
@keyframes fillUp{from{width:0}to{width:100%}}

/* ================= 底部白渐变 + OPEN ================= */
.bottom{position:absolute;left:0;right:0;bottom:0;height:34%;
  opacity:0;pointer-events:none;
  animation:bottomIn 1.2s cubic-bezier(.22,.68,.2,1) 4.3s both}
.bottom.up{animation:bottomOut .95s cubic-bezier(.4,.05,.2,1) both}
@keyframes bottomIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes bottomOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(26%)}
}
.grad{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,
    #ffffff 0%,
    #ffffff 40%,
    rgba(255,255,255,.88) 62%,
    rgba(255,255,255,.42) 82%,
    rgba(255,255,255,0) 100%)}
.open{position:absolute;left:0;right:0;bottom:62px;text-align:center;
  font-family:'Playball',cursive;color:#17376e;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none}
.open .l1{font-size:30px;line-height:1.2;letter-spacing:.005em}
.open .l2{font-size:18px;line-height:1;letter-spacing:.24em;margin-top:3px;opacity:.66}

/* ================= 上滑提示角标 ================= */
.hint{position:absolute;left:50%;bottom:26px;width:13px;height:13px;margin-left:-6.5px;
  opacity:0;border-left:1.4px solid #17376e;border-top:1.4px solid #17376e;
  animation:hintIn .9s ease 4.95s both, bob 1.9s ease-in-out 5.85s infinite}
.hint.off{animation:none;opacity:0}
@keyframes hintIn{from{opacity:0}to{opacity:.55}}
@keyframes bob{
  0%{opacity:.2;transform:translate(0,4px) rotate(45deg)}
  45%{opacity:.62;transform:translate(0,-4px) rotate(45deg)}
  100%{opacity:.2;transform:translate(0,4px) rotate(45deg)}
}

/* 调试：?done 一切立刻到位 */
body.done *{animation-delay:0s !important}
</style>
<link rel="stylesheet" href="../base/theme.css?v=1021a">
<script src="../base/theme.js?v=1021a"></script>

</head>
<body>
<div class="stage" id="stage">

  <img class="layer fade" style="--d:.05s" src="layers/bg.png" alt="">

  <!-- 第一位次：1 → 2 → 3 逐层上浮 -->
  <img class="layer rise" style="--d:.40s" src="layers/f1.png" alt="">
  <img class="layer rise" style="--d:.86s" src="layers/f2.png" alt="">
  <!-- 第二位次 ×4：一起渐显 -->
  <img class="layer fade" style="--d:1.85s" src="layers/s1.png" alt="">
  <img class="layer fade" style="--d:1.85s" src="layers/s2.png" alt="">
  <img class="layer rise" style="--d:1.32s" src="layers/f3.png" alt="">
  <img class="layer fade" style="--d:1.85s" src="layers/s4.png" alt="">
  <!-- 第三位次 -->
  <img class="layer fade" style="--d:2.75s" src="layers/t3.png" alt="">
  <!-- 第四位次：上滑开门后才出现 -->
  <img class="layer fourth" id="fourth" src="layers/t4.png" alt="">

  <div class="stack">
  <div class="clock">
    <div class="fc">
      <span class="fl" id="f0">0</span><span class="fl" id="f1">0</span><span class="colon">:</span><span class="fl" id="f2">0</span><span class="fl" id="f3">0</span>
    </div>
    <div class="rule"></div>
    <div class="meta">
      <div class="d" id="date">10.20 TUE</div>
      <div class="n" id="since">第 227 天</div>
    </div>
  </div>

  <div class="dots">
    <button class="dot" id="dotMsg" aria-label="消息">
      <svg viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.6 7.1L4 20l1.5-4.6a8 8 0 1 1 15-3.9z"/></svg>
      <span class="badge" id="tagMsg"></span>
    </button>
    <button class="dot" id="dotDiary" aria-label="日记">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h11.5a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z"/><path d="M6 3.5A1.5 1.5 0 0 0 4.5 5v14A1.5 1.5 0 0 0 6 20.5"/><path d="M9 8.5h6M9 12.5h6"/></svg>
      <span class="badge" id="tagDiary"></span>
    </button>
  </div>
</div>

  <div class="bar"><i></i></div>

  <div class="bottom" id="bottom">
    <div class="grad"></div>
    <div class="open" id="openBtn">
      <div class="l1">HaiTang Yu ZhaoGe</div>
      <div class="l2">OPEN</div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

</div>

<script>
(function(){
  var stage  = document.getElementById('stage');
  var fourth = document.getElementById('fourth');
  var bottom = document.getElementById('bottom');
  var hint   = document.getElementById('hint');

  /* ---- 时钟 ---- */
  var WK = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function setDigit(el, ch){
    if(el.textContent === ch) return;
    el.classList.remove('turn');
    void el.offsetWidth;
    el.classList.add('turn');
    setTimeout(function(){ el.textContent = ch; el.classList.remove('turn'); }, 190);
  }
  var START = new Date(2026, 2, 8);
  function tick(){
    var d = new Date();
    var s = pad(d.getHours()) + pad(d.getMinutes());
    for(var i = 0; i < 4; i++) setDigit(document.getElementById('f'+i), s.charAt(i));
    document.getElementById('date').textContent =
      pad(d.getMonth()+1) + '.' + pad(d.getDate()) + ' ' + WK[d.getDay()];
    var day = Math.floor((d - START) / 86400000) + 1;
    document.getElementById('since').textContent = '第 ' + day + ' 天';
  }
  tick(); setInterval(tick, 8000);

  /* ---- 未读角标 ---- */
  var tagMsg = document.getElementById('tagMsg');
  var tagDiary = document.getElementById('tagDiary');
  function setBadge(el, n){
    if(!n || n <= 0){ el.classList.remove('on'); return; }
    el.textContent = n > 99 ? '99+' : n;
    el.classList.add('on');
  }
  setTimeout(function(){
    fetch('../../data.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      var seenD = parseInt(localStorage.getItem('zg_seen_diary') || '0', 10);
      var seenL = parseInt(localStorage.getItem('zg_seen_letter') || '0', 10);
      var nd = 0, nl = 0;
      (d.diaries || []).forEach(function(x){ if((x.createdAt || 0) > seenD) nd++; });
      (d.letters || []).forEach(function(x){ if((x.createdAt || 0) > seenL) nl++; });
      setBadge(tagDiary, nd);
      setBadge(tagMsg, nl);
    }).catch(function(){ setBadge(tagDiary, 1); });
  }, 700);

  document.getElementById('dotMsg').addEventListener('click', function(){
    document.dispatchEvent(new CustomEvent('zhaoge:splash:msg'));
  });
  document.getElementById('dotDiary').addEventListener('click', function(){
    document.dispatchEvent(new CustomEvent('zhaoge:splash:diary'));
  });

  /* ---- 调试参数 ---- */
  var q = location.search;
  var ready = false, sy = null, sx = null, fired = false;
  if(q.indexOf('done') > -1){
    document.body.classList.add('done');
    fourth.classList.add('on');
    ready = true;
  } else {
    setTimeout(function(){ ready = true; }, 4600);
  }

  /* ---- 上滑：掀开底部，第四位次浮上来 ---- */
  function fire(){
    if(!ready || fired) return;
    fired = true;
    bottom.classList.add('up');
    hint.classList.add('off');
    setTimeout(function(){ fourth.classList.add('on'); }, 240);
    setTimeout(function(){
      document.dispatchEvent(new CustomEvent('zhaoge:splash:open'));
      if (q.indexOf('embed') > -1) {
        try { parent.postMessage('zgSplashDone', '*'); } catch (e) { }
      } else {
        window.location.replace('../home/home.html?back=1');
      }
    }, 1400);
  }

  stage.addEventListener('touchstart', function(e){
    sy = e.touches[0].clientY; sx = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchmove', function(e){
    if(sy === null) return;
    var dy = e.touches[0].clientY - sy;
    var dx = Math.abs(e.touches[0].clientX - sx);
    if(dy < -42 && Math.abs(dy) > dx){ sy = null; fire(); }
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if(sy === null) return;
    var dy = e.changedTouches[0].clientY - sy;
    sy = null;
    if(dy < -42) fire();
  }, {passive:true});
  stage.addEventListener('wheel', function(e){ if(e.deltaY < -30) fire(); }, {passive:true});
  document.getElementById('openBtn').addEventListener('click', fire);

  if(q.indexOf('auto') > -1) setTimeout(fire, 5000);
})();
</script>
<script src="../base/snow.js"></script>
</body>
</html>
