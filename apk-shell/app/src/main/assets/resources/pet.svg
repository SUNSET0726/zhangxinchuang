<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="240" height="298">
  <defs>
    <style>
      .pf { animation: pf 3.6s ease-in-out infinite alternate; transform-origin: 250px 540px; }
      @keyframes pf { from { transform: translateY(0px); } to { transform: translateY(-8px); } }
      .pt { animation: pt 2.7s ease-in-out infinite alternate; transform-origin: 360px 540px; }
      @keyframes pt { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
      .pb { animation: pb 2.4s ease-in-out infinite alternate; transform-origin: 250px 150px; }
      @keyframes pb { from { transform: translateY(1px) rotate(-2deg); } to { transform: translateY(-5px) rotate(2deg); } }
      .pla { animation: pla 3.2s ease-in-out infinite alternate; transform-origin: 250px 62px; }
      @keyframes pla { from { transform: rotate(-8deg); } to { transform: rotate(9deg); } }
      .plb { animation: plb 3.9s ease-in-out infinite alternate; transform-origin: 352px 150px; }
      @keyframes plb { from { transform: rotate(8deg); } to { transform: rotate(-9deg); } }
      .pe { animation: pe 6.5s infinite; }
      @keyframes pe { 0%,92%,100% { transform: scaleY(1); } 95%,97% { transform: scaleY(0.07); } }
    </style>
  </defs>

  <g class="pf">
